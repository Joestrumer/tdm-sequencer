<!DOCTYPE html>

  <script>
    // Nettoyer les paramètres tracking Brevo (?_se=...) de l'URL
    if (window.location.search.includes('_se=')) {
      const url = new URL(window.location);
      url.searchParams.delete('_se');
      window.history.replaceState({}, '', url.pathname + (url.search || ''));
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#F9F7F1',
              100: '#F1EDDD',
              200: '#E3DCC0',
              300: '#D1C79F',
              400: '#B9AA6F',
              500: '#A28E3F',
              600: '#877633',
              700: '#6C5E29',
              800: '#51461F',
              900: '#362F15',
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tache {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .tache-1 {
      top: -40px;
      right: -30px;
      width: 420px;
      height: 420px;
      background: radial-gradient(ellipse at 45% 45%, rgba(162,142,63,0.18) 0%, rgba(162,142,63,0.08) 35%, transparent 65%);
      border-radius: 42% 58% 55% 45% / 50% 42% 58% 50%;
      transform: rotate(-15deg);
    }
    .tache-2 {
      bottom: 5%;
      left: -40px;
      width: 360px;
      height: 360px;
      background: radial-gradient(ellipse at 55% 50%, rgba(162,142,63,0.14) 0%, rgba(162,142,63,0.06) 35%, transparent 65%);
      border-radius: 55% 45% 48% 52% / 45% 55% 45% 55%;
      transform: rotate(10deg);
    }
    .tache-3 {
      top: 40%;
      right: 5%;
      width: 300px;
      height: 300px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.10) 0%, rgba(162,142,63,0.04) 35%, transparent 60%);
      border-radius: 48% 52% 45% 55% / 52% 48% 52% 48%;
      transform: rotate(25deg);
    }
    .tache-login-1 {
      top: 10%;
      right: 5%;
      width: 45vw;
      height: 45vw;
      max-width: 550px;
      max-height: 550px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.20) 0%, rgba(162,142,63,0.10) 30%, rgba(162,142,63,0.03) 55%, transparent 70%);
      border-radius: 42% 58% 52% 48% / 48% 42% 58% 52%;
      transform: rotate(-10deg);
    }
    .tache-login-2 {
      bottom: 8%;
      left: 3%;
      width: 40vw;
      height: 40vw;
      max-width: 480px;
      max-height: 480px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.16) 0%, rgba(162,142,63,0.07) 35%, transparent 65%);
      border-radius: 55% 45% 48% 52% / 52% 55% 45% 48%;
      transform: rotate(20deg);
    }
    html.dark body { background: #0f172a; }
    .dark .tache-1, .dark .tache-2, .dark .tache-3 { opacity: 0.3; }
    .dark .tache-login-1, .dark .tache-login-2 { opacity: 0.3; }

    /* ─── Accueil maquette ──────────────────────────────────────────── */
    #tdm-partner-preview{--tdm-paper:#fbfaf7;--tdm-white:#fff;--tdm-ink:#242a23;--tdm-muted:#6c7066;--tdm-line:#dedfd5;--tdm-soft:#f0f0e9;--tdm-olive:#686c45;--tdm-dark:#30392d;--tdm-on-dark:#fcfcf7;color:var(--tdm-ink);background:var(--tdm-paper);font-family:'DM Sans',Arial,sans-serif;font-size:14px;line-height:1.5;width:100%;overflow:clip;isolation:isolate}
    .dark #tdm-partner-preview{--tdm-paper:#191b18;--tdm-white:#232621;--tdm-ink:#f0eee6;--tdm-muted:#b5b8ab;--tdm-line:#42473d;--tdm-soft:#2e332b;--tdm-olive:#c3c69a;--tdm-dark:#dfe5d5;--tdm-on-dark:#252b22}
    #tdm-partner-preview *{box-sizing:border-box}
    #tdm-partner-preview [hidden]{display:none!important}
    #tdm-partner-preview h1,#tdm-partner-preview h2,#tdm-partner-preview h3,#tdm-partner-preview p{margin:0;color:inherit}
    #tdm-partner-preview button,#tdm-partner-preview select{font:inherit;color:inherit}
    #tdm-partner-preview button:focus-visible,#tdm-partner-preview a:focus-visible,#tdm-partner-preview select:focus-visible{outline:2px solid var(--tdm-olive);outline-offset:4px}
    #tdm-partner-preview button{border-radius:0}
    #tdm-partner-preview a{color:inherit}
    #tdm-partner-preview .tdm-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--tdm-olive);font-weight:500}
    #tdm-partner-preview .tdm-serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;letter-spacing:-.8px}
    #tdm-partner-preview .tdm-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:23px 36px;background:var(--tdm-white);border-bottom:1px solid var(--tdm-line)}
    #tdm-partner-preview .tdm-brand{display:flex;align-items:center;gap:18px;min-width:0}
    #tdm-partner-preview .tdm-logo{width:96px;height:50px;object-fit:contain}
    .dark #tdm-partner-preview .tdm-logo{filter:invert(1)}
    #tdm-partner-preview .tdm-brand-note{padding-left:17px;border-left:1px solid var(--tdm-line);color:var(--tdm-muted);font-size:11px;letter-spacing:1.7px;line-height:1.7;text-transform:uppercase}
    #tdm-partner-preview .tdm-nav{display:flex;align-items:center;gap:22px}
    #tdm-partner-preview .tdm-nav button{border:0;background:none;padding:8px 0;font-size:12px;color:var(--tdm-muted);white-space:nowrap;cursor:pointer}
    #tdm-partner-preview .tdm-nav button.tdm-nav-active{color:var(--tdm-ink);border-bottom:1px solid var(--tdm-ink)}
    #tdm-partner-preview .tdm-account{display:flex;align-items:center;gap:18px;font-size:12px}
    #tdm-partner-preview .tdm-bag{display:flex;align-items:center;gap:8px;border:1px solid var(--tdm-line);background:var(--tdm-white);padding:10px 13px;font-size:12px;white-space:nowrap;cursor:pointer}
    #tdm-partner-preview .tdm-bag-count{min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;background:var(--tdm-dark);color:var(--tdm-on-dark);font-size:11px;border-radius:50%}
    #tdm-partner-preview .tdm-main{padding:0 0 32px}
    #tdm-partner-preview .tdm-welcome{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px 0;font-size:12px;color:var(--tdm-muted)}
    #tdm-partner-preview .tdm-welcome strong{color:var(--tdm-ink);font-weight:500}
    #tdm-partner-preview .tdm-hero{display:grid;grid-template-columns:1.13fr 1fr;min-height:320px;background:var(--tdm-soft)}
    #tdm-partner-preview .tdm-hero-copy{padding:32px 32px 30px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
    #tdm-partner-preview .tdm-hero h1{font-size:50px;line-height:1.03;margin:15px 0 17px;letter-spacing:-1.8px}
    #tdm-partner-preview .tdm-hero h1 em{color:var(--tdm-olive);font-weight:400}
    #tdm-partner-preview .tdm-hero-copy>p:not(.tdm-eyebrow){font-size:13px;line-height:1.7;max-width:365px;color:var(--tdm-muted)}
    #tdm-partner-preview .tdm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}
    #tdm-partner-preview .tdm-action{border:1px solid var(--tdm-dark);background:var(--tdm-dark);color:var(--tdm-on-dark);padding:12px 15px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:12px;font-weight:500;min-height:42px;transition:opacity .15s;cursor:pointer}
    #tdm-partner-preview .tdm-action:hover{opacity:.83}
    #tdm-partner-preview .tdm-action.tdm-outline{background:transparent;color:var(--tdm-ink);border-color:var(--tdm-line)}
    #tdm-partner-preview .tdm-hero-photo{position:relative;min-height:300px;margin:0;overflow:hidden}
    #tdm-partner-preview .tdm-hero-photo img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:63% 46%}
    #tdm-partner-preview .tdm-hero-photo figcaption{position:absolute;left:18px;bottom:15px;color:#fff;font-size:11px;padding:5px 9px;background:#242a2377;backdrop-filter:blur(6px);letter-spacing:.4px}
    #tdm-partner-preview .tdm-assurances{display:flex;justify-content:space-between;gap:16px;padding:17px 10px;border-bottom:1px solid var(--tdm-line);color:var(--tdm-muted);font-size:11px}
    #tdm-partner-preview .tdm-assurances span{display:flex;align-items:center;gap:8px}
    #tdm-partner-preview .tdm-section{padding-top:31px;scroll-margin-top:20px}
    #tdm-partner-preview .tdm-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:18px}
    #tdm-partner-preview .tdm-section h2{font-size:32px;line-height:1.12}
    #tdm-partner-preview .tdm-section-sub{color:var(--tdm-muted);font-size:12px;margin-top:6px}
    #tdm-partner-preview .tdm-textlink{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:1px solid var(--tdm-line);padding:4px 0;color:var(--tdm-ink);font-size:12px;white-space:nowrap;cursor:pointer}
    #tdm-partner-preview .tdm-essentials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    #tdm-partner-preview .tdm-essential{background:var(--tdm-white);border:1px solid var(--tdm-line);padding:14px;min-width:0}
    #tdm-partner-preview .tdm-essential-top{display:flex;gap:8px;align-items:center;margin-bottom:10px;min-height:82px}
    #tdm-partner-preview .tdm-essential img{width:68px;height:85px;object-fit:contain;flex-shrink:0}
    #tdm-partner-preview .tdm-essential h3{font-size:13px;font-weight:500;line-height:1.45}
    #tdm-partner-preview .tdm-essential p{font-size:11px;color:var(--tdm-muted);margin-top:2px}
    #tdm-partner-preview .tdm-essential .tdm-essential-cost{font-size:12px;color:var(--tdm-ink);margin-top:7px}
    #tdm-partner-preview .tdm-essential-controls{display:grid;grid-template-columns:auto 1fr;gap:7px}
    #tdm-partner-preview .tdm-essential select{max-width:100%;min-width:0;font-size:11px;padding:9px 5px;border:1px solid var(--tdm-line);background:var(--tdm-white);cursor:pointer}
    #tdm-partner-preview .tdm-add-small{padding:10px 7px;background:var(--tdm-soft);border:1px solid var(--tdm-line);font-size:11px;white-space:nowrap;cursor:pointer}
    #tdm-partner-preview .tdm-add-small:hover{background:var(--tdm-line)}
    #tdm-partner-preview .tdm-vip{padding-top:41px}
    #tdm-partner-preview .tdm-vip-head .tdm-eyebrow{margin-bottom:11px}
    #tdm-partner-preview .tdm-vip h2{font-size:39px;line-height:1.06}
    #tdm-partner-preview .tdm-vip-intro{font-size:12px;color:var(--tdm-muted);margin-top:11px;max-width:510px;line-height:1.65}
    #tdm-partner-preview .tdm-vip-photo{flex-shrink:0;align-self:center;max-width:440px;border-radius:6px;overflow:hidden}
    #tdm-partner-preview .tdm-vip-photo img{width:100%;height:auto;display:block;object-fit:cover}
    #tdm-partner-preview .tdm-filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 18px}
    #tdm-partner-preview .tdm-filter{background:transparent;color:var(--tdm-muted);border:1px solid var(--tdm-line);padding:8px 12px;font-size:11px;cursor:pointer}
    #tdm-partner-preview .tdm-filter.tdm-filter-active{background:var(--tdm-dark);border-color:var(--tdm-dark);color:var(--tdm-on-dark)}
    #tdm-partner-preview .tdm-gifts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    #tdm-partner-preview .tdm-product{min-width:0;display:flex;flex-direction:column}
    #tdm-partner-preview .tdm-product-stage{position:relative;min-height:160px;background:var(--tdm-soft);overflow:hidden;display:flex;align-items:center;justify-content:center}
    #tdm-partner-preview .tdm-product-stage img{width:100%;height:160px;object-fit:contain;padding:5px;transition:transform .22s}
    #tdm-partner-preview .tdm-product:hover .tdm-product-stage img{transform:scale(1.045)}
    #tdm-partner-preview .tdm-product-stage.tdm-mask-stage{background:var(--tdm-white)}
    #tdm-partner-preview .tdm-product-ref{position:absolute;left:13px;top:11px;font-size:11px;color:var(--tdm-muted);z-index:1;letter-spacing:1px}
    #tdm-partner-preview .tdm-mask-stage .tdm-product-ref{color:var(--tdm-muted)}
    #tdm-partner-preview .tdm-product-body{padding:12px 0 0;display:flex;flex-direction:column;flex:1}
    #tdm-partner-preview .tdm-product h3{font-size:13px;font-weight:500;margin-bottom:3px}
    #tdm-partner-preview .tdm-product-kind{font-size:10px;color:var(--tdm-muted);letter-spacing:.2px}
    #tdm-partner-preview .tdm-product-desc{font-size:11px;color:var(--tdm-muted);line-height:1.5;margin:6px 0 10px;min-height:33px}
    #tdm-partner-preview .tdm-product-price{font-size:18px;font-weight:400;letter-spacing:-.5px;margin-top:auto}
    #tdm-partner-preview .tdm-product-price span{font-size:10px;color:var(--tdm-muted);letter-spacing:0}
    #tdm-partner-preview .tdm-product-pack{font-size:10px;color:var(--tdm-muted);margin:3px 0 10px}
    #tdm-partner-preview .tdm-product-pack strong{color:var(--tdm-ink);font-weight:500}
    #tdm-partner-preview .tdm-add{width:100%;background:transparent;border:1px solid var(--tdm-ink);color:var(--tdm-ink);padding:11px;display:flex;justify-content:space-between;align-items:center;font-size:12px;min-height:43px;cursor:pointer}
    #tdm-partner-preview .tdm-add:hover{background:var(--tdm-dark);color:var(--tdm-on-dark)}
    #tdm-partner-preview .tdm-add-active,#tdm-partner-preview .tdm-add-small.tdm-add-active{background:var(--tdm-dark);color:var(--tdm-on-dark);border-color:var(--tdm-dark)}
    #tdm-partner-preview .tdm-qty-row{display:flex;align-items:center;gap:0;width:100%;border:1px solid var(--tdm-dark);overflow:hidden}
    #tdm-partner-preview .tdm-qty-btn{background:var(--tdm-soft);border:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--tdm-ink);display:flex;align-items:center;justify-content:center;transition:background .15s}
    #tdm-partner-preview .tdm-qty-btn:hover{background:var(--tdm-line)}
    #tdm-partner-preview .tdm-qty-label{flex:1;text-align:center;font-size:12px;font-weight:600;background:var(--tdm-dark);color:var(--tdm-on-dark);white-space:nowrap}
    #tdm-partner-preview .tdm-qty-row.tdm-qty-small .tdm-qty-btn{padding:6px 10px;font-size:12px}
    #tdm-partner-preview .tdm-qty-row.tdm-qty-small .tdm-qty-label{padding:6px 4px;font-size:11px}
    #tdm-partner-preview .tdm-qty-row.tdm-qty-large .tdm-qty-btn{padding:11px 14px;font-size:15px}
    #tdm-partner-preview .tdm-qty-row.tdm-qty-large .tdm-qty-label{padding:11px 6px;font-size:12px}
    #tdm-partner-preview .tdm-status{display:flex;justify-content:space-between;align-items:center;gap:15px;background:var(--tdm-soft);margin-top:16px;padding:12px 15px;font-size:12px}
    #tdm-partner-preview .tdm-coffret{margin-top:34px;padding:26px 28px;display:grid;grid-template-columns:58px 1fr auto;gap:22px;align-items:center;border:1px solid var(--tdm-line);background:var(--tdm-soft)}
    #tdm-partner-preview .tdm-gift-icon{width:55px;height:65px;display:flex;align-items:center;justify-content:center;color:var(--tdm-olive);border:1px solid var(--tdm-line)}
    #tdm-partner-preview .tdm-gift-icon svg{width:27px;height:27px;stroke-width:1}
    #tdm-partner-preview .tdm-coffret h2{font-size:29px;line-height:1.1;margin:5px 0 8px}
    #tdm-partner-preview .tdm-coffret p:not(.tdm-eyebrow){font-size:12px;color:var(--tdm-muted);max-width:390px}
    #tdm-partner-preview .tdm-coffret-action{text-align:right}
    #tdm-partner-preview .tdm-coffret-action>p{margin-bottom:11px}
    #tdm-partner-preview .tdm-coffret-action strong{font-weight:500;color:var(--tdm-ink)}
    #tdm-partner-preview .tdm-contact{background:var(--tdm-white);padding:22px;margin-top:12px;display:flex;justify-content:space-between;gap:20px;align-items:center;border:1px solid var(--tdm-line);font-size:12px}
    #tdm-partner-preview .tdm-contact p{color:var(--tdm-muted);margin-top:5px}
    #tdm-partner-preview .tdm-contact-details{display:grid;gap:4px;text-align:right}
    #tdm-partner-preview .tdm-foot{padding:28px 0 0;display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:11px;color:var(--tdm-muted)}
    #tdm-partner-preview .tdm-foot .tdm-foot-signature{letter-spacing:2px;text-transform:uppercase;color:var(--tdm-ink)}
    #tdm-partner-preview .tdm-foot a{text-decoration:none;border-bottom:1px solid var(--tdm-line)}
    @media(max-width:850px){#tdm-partner-preview .tdm-hero h1{font-size:43px}#tdm-partner-preview .tdm-hero-copy{padding:27px 24px}#tdm-partner-preview .tdm-hero{grid-template-columns:1.1fr 1fr}#tdm-partner-preview .tdm-essential{padding:10px}#tdm-partner-preview .tdm-essential img{width:50px}#tdm-partner-preview .tdm-essential-controls{grid-template-columns:1fr}#tdm-partner-preview .tdm-coffret{grid-template-columns:1fr auto}#tdm-partner-preview .tdm-gift-icon{display:none}}

<body>
  <script>if (localStorage.getItem('tdm_dark_mode') === 'true') document.documentElement.classList.add('dark');</script>
  <div id="root"></div>

  <script>
    const API_BASE = window.location.origin + '/api/partenaire';

    window.partnerApi = {
      _headers: () => {
        const token = sessionStorage.getItem('partner_token') || '';
        const h = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        const actingAs = sessionStorage.getItem('partner_acting_as');
        if (actingAs) h['X-Acting-Partner-Id'] = actingAs;
        return h;
      },
      _handle: (r) => {
        if (r.status === 401) { sessionStorage.removeItem('partner_token'); window.location.reload(); throw new Error('Session expirée'); }
        return r.json();
      },
      get: (path) => fetch(API_BASE + path, { headers: window.partnerApi._headers() }).then(window.partnerApi._handle),
      post: (path, body) => fetch(API_BASE + path, { method: 'POST', headers: window.partnerApi._headers(), body: JSON.stringify(body) }).then(window.partnerApi._handle),
      patch: (path, body) => fetch(API_BASE + path, { method: 'PATCH', headers: window.partnerApi._headers(), body: JSON.stringify(body) }).then(window.partnerApi._handle),
      del: (path) => fetch(API_BASE + path, { method: 'DELETE', headers: window.partnerApi._headers() }).then(window.partnerApi._handle),
    };
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const api = window.partnerApi;
    const normalizeText = (str) => str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    // ─── Toast ──────────────────────────────────────────────────────────────────
    const Toast = ({ toast }) => {
      if (!toast || !toast.visible) return null;
      const colors = { success: "bg-green-600", error: "bg-red-500", info: "bg-gray-800" };
      return (
        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-white text-sm font-medium animate-fade-in ${colors[toast.type] || colors.info}`}>
          {toast.type === "success" && "\u2713 "}{toast.type === "error" && "\u2717 "}{toast.message}
        </div>
      );
    };

    // ─── Login Screen ───────────────────────────────────────────────────────────
    const LoginScreen = ({ onLogin }) => {
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleLogin = async () => {
        if (!password.trim()) return;
        setLoading(true);
        setError("");
        try {
          const res = await api.post('/login', { password: password.trim() });
          if (res.erreur) {
            setError(res.erreur);
          } else if (res.token) {
            sessionStorage.setItem('partner_token', res.token);
            onLogin(res);
          }
        } catch (e) {
          setError("Impossible de contacter le serveur");
        }
        setLoading(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
          <div className="tache tache-login-1"></div>
          <div className="tache tache-login-2"></div>
          <div className="relative z-10 w-full max-w-sm animate-fade-in text-center">
            <div className="mb-10">
              <img src="/logo-tdm-anim.gif" alt="Terre de Mars" className="h-24 mx-auto mb-6" />
            </div>
            <div className="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-2xl p-8 shadow-sm dark:shadow-none">
              <h2 className="text-sm font-medium text-gray-700 dark:text-slate-200 mb-1">Espace Partenaire</h2>
              <p className="text-xs text-gray-400 dark:text-slate-500 mb-6">Entrez votre mot de passe pour acc&eacute;der au catalogue.</p>
              <input
                type="password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                placeholder="Mot de passe..."
                className="w-full bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-gold-500/50 focus:border-gold-500/40"
                autoFocus
              />
              {error && <p className="text-red-500 text-xs mt-2">{error}</p>}
              <button
                onClick={handleLogin}
                disabled={loading}
                className="w-full mt-4 bg-gold-500 text-white py-3 rounded-xl text-sm font-medium hover:bg-gold-600 transition-colors disabled:opacity-50"
              >
                {loading ? "Connexion..." : "Acc\u00e9der"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ─── Constantes amenities ─────────────────────────────────────────────────
    const AMENITY_TYPES = [
      { key: 'gel_douche', label: 'Gel douche', gammes: [
        { ref: 'P008', gamme: 'Verveine / Reddition' },
        { ref: 'P035', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'shampoing', label: 'Shampoing', gammes: [
        { ref: 'P019', gamme: 'Verveine / Reddition' },
        { ref: 'P010', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P034', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'gel_corps_cheveux', label: 'Gel Corps & Cheveux', gammes: [
        { ref: 'P042', gamme: 'Verveine / Reddition' },
        { ref: 'P014', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P040', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'apres_shampoing', label: 'Apr\u00e8s-shampoing', gammes: [
        { ref: 'P024', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P037', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'lotion', label: 'Lotion Corps & Main', gammes: [
        { ref: 'P036', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
        { ref: 'P011', gamme: 'V\u00e9tiver / Imminence' },
      ]},
      { key: 'savon_main', label: 'Savon Liquide Main', gammes: [
        { ref: 'P007', gamme: 'V\u00e9tiver / Insurrection' },
      ]},
    ];

    // ─── Section Amenities (produits en chambre) ──────────────────────────────
    const is5L = (ref, baseRef) => ref === baseRef + '-5000';
    const is500ml = (ref, baseRef) => ref === baseRef;

    // ─── Images produits (CDN Shopify) ──────────────────────────────────────────
    // Base CDN
    const CDN = 'https://cdn.shopify.com/s/files/1/0955/1141/3001/files/';
    const PRODUCT_IMAGES = {
      // Cadeaux VIP & Spa
      'P016': CDN + 'P016_1.png',
      'P012': CDN + 'P012_1.png',
      'P009': CDN + 'P009_4.jpg',
      'P020': CDN + 'P020_6.jpg',
      'P021-20': CDN + 'P021-20_3.jpg',
      'P023': CDN + 'P023_1.png',
      // Produits Spa
      'P003': CDN + 'P003_1.png',
      'P004': CDN + 'P004-500_1.png',
      'P004-500': CDN + 'P004-500_1.png',
      'P005': CDN + 'P005_1.png',
      'P006': CDN + 'P006_1.png',
      'P021': CDN + 'P021_1.png',
      'P022': CDN + 'P022_1.png',
      'P027': CDN + 'P027_1.png',
      'P029': CDN + 'P029_1.png',
      'P317-100': CDN + 'P317-100_1.png',
      // Parfums & gel hydroalcoolique
      'P015': CDN + 'P015_1.png',
      'P018': CDN + 'P018-5000_4.jpg',
      'P018-50': CDN + 'P018-5000_4.jpg',
      'P018-5000': CDN + 'P018-5000_4.jpg',
      'P039': CDN + 'P039_1.png',
      'P039-200V': CDN + 'P039_1.png',
      'P039-500': CDN + 'P039-500_1.png',
      'P039-3000V': CDN + 'P039-3000V.jpg',
      'P039-5000': CDN + 'P039-5000_1.png',
      'P039SPRAY-VIDE': CDN + 'P039SPRAY_1.png',
      'P041': CDN + 'P041_1.png',
      'P041-500': CDN + 'P041-500_1.png',
      'P041-5000': CDN + 'P041_1.png',
      // Flacons 500ml
      'P007': CDN + 'P007_1.png',
      'P008': CDN + 'P008_1.png',
      'P010': CDN + 'P010_1_1143dd73-82fb-4306-8ed2-01219c5751e0.png',
      'P011': CDN + 'P011_1.png',
      'P014': CDN + 'P014_1.png',
      'P019': CDN + 'P019_1.png',
      'P024': CDN + 'P024_1.png',
      'P034': CDN + 'P034_1.png',
      'P035': CDN + 'P035_1.png',
      'P036': CDN + 'P036_1.png',
      'P037': CDN + 'P037_1.png',
      'P040': CDN + 'P040_1.png',
      'P042': CDN + 'P042_1.png',
      'P044': CDN + '044_500ml.png',
      'P045': CDN + '045_500ml.png',
      'P046': CDN + '046_500ml.png',
      'P047': CDN + '047_500ml.png',
      // Produits hygiène format voyage (tubes)
      'P008-75': CDN + 'P008-150_1.png',
      'P008-150': CDN + 'P008-150_1.png',
      'P010-30': CDN + 'P010-30_1.png',
      'P010-50': CDN + 'P010-50_1.png',
      'P010-150': CDN + 'P010-150_1.png',
      'P011-100': CDN + 'P011-100_1.png',
      'P011-30': CDN + 'P011-100_1.png',
      'P019-50': CDN + 'P019-50_1.png',
      'P024-40': CDN + 'P024-40_1.png',
      'P034-100': CDN + 'P034-100_1.png',
      'P035-100': CDN + 'P035-100_1.png',
      'P036-100': CDN + 'P036-100_1.png',
      'P037-100': CDN + 'P037-100_1.png',
      // Savons
      'P017': CDN + 'P017_1.png',
      'P017-30': CDN + 'P017-30_1.png',
      // Portes flacons
      'PFS': CDN + 'PFS_1.png',
      'PFD': CDN + 'PFD_1.png',
      'PFT': CDN + 'PFT_1.png',
      'SPFS': CDN + 'SPFS_1.png',
      'PSS': CDN + 'PSS_1.png',
      // Coffrets
      'COFFRETS': CDN + 'coffret_tdem11_2.jpg',
      // Flacons vides
      'DENVER-500ML-VIDE': CDN + 'DENVER-500ML-VIDE.jpg',
    };
    // Variantes : si la ref exacte n'est pas dans le mapping, chercher la ref de base
    const getProductImageUrl = (ref) => {
      if (PRODUCT_IMAGES[ref]) return PRODUCT_IMAGES[ref];
      // Essayer la ref de base (P008-5000 → P008, P010-150 → P010, P034-100 → P034)
      const base = ref.replace(/-\d+.*$/, '').replace(/V$/, '').replace(/-SANS POMPE$/, '');
      return PRODUCT_IMAGES[base] || null;
    };

    const ProductImage = ({ productRef, nom, imageUrl, className = "" }) => {
      const [imgError, setImgError] = useState(false);
      const src = imageUrl || getProductImageUrl(productRef);
      const initials = (nom || productRef || '').split(/[\s-]+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      if (!src || imgError) {
        return (
          <div className={`bg-gold-50 dark:bg-gold-900/20 flex items-center justify-center ${className}`}>
            <span className="text-gold-500 dark:text-gold-400 font-display font-semibold text-lg">{initials}</span>
          </div>
        );
      }
      return <img src={src} alt={nom || productRef} className={`object-cover ${className}`} onError={() => setImgError(true)} />;
    };

    const AmenityProductRow = ({ p, getQty, addCarton, removeCarton }) => {
      const moq = p.moq || 1;
      const qty = getQty(p.ref);
      const cartons = moq > 1 ? Math.floor(qty / moq) : qty;
      const inCart = qty > 0;
      const unitPrice = p.prix_promo ?? p.prix_remise;
      return (
        <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg transition-colors ${inCart ? 'bg-gold-50 dark:bg-gold-900/30 border-l-2 border-l-gold-500' : 'hover:bg-gray-50 dark:hover:bg-slate-700'}`}>
          <div className="flex-1 min-w-0 flex items-center gap-2">
            <span className="text-xs sm:text-sm text-gray-900 dark:text-white truncate">{p.nom}</span>
            {p.promo_pct > 0 ? (
              <>
                <span className="text-[10px] text-gray-400 dark:text-slate-500 line-through shrink-0">{p.prix_remise.toFixed(2)}&euro;</span>
                <span className="text-xs font-bold text-red-600 dark:text-red-400 shrink-0">{p.prix_promo.toFixed(2)}&euro;/u</span>
                <span className="text-[10px] px-1 py-0.5 rounded-full bg-red-500 text-white font-bold shrink-0">-{p.promo_pct}%</span>
              </>
            ) : (
              <>
                <span className="text-xs font-semibold text-gold-600 shrink-0">{p.prix_remise.toFixed(2)}&euro; HT/u</span>
                {p.discount_pct > 0 && <span className="text-[10px] px-1 py-0.5 rounded bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium shrink-0">-{p.discount_pct}%</span>}
              </>
            )}
            {moq > 1 && <span className="text-[10px] text-gray-400 dark:text-slate-500 shrink-0">x{moq}={( unitPrice * moq).toFixed(2)}&euro;</span>}
          </div>
          <div className="flex items-center gap-1 shrink-0">
            {qty > 0 && (
              <button onClick={() => removeCarton(p.ref)} className="w-8 h-8 rounded-lg bg-gray-100 dark:bg-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-500 flex items-center justify-center text-sm font-bold transition-colors">-</button>
            )}
            {qty > 0 && (
              <div className="text-center min-w-[28px]">
                <div className="text-gray-900 dark:text-white font-semibold text-sm leading-none">{moq > 1 ? cartons : qty}</div>
                {moq > 1 && <div className="text-[9px] text-gray-400 dark:text-slate-500 leading-none">{qty}u.</div>}
              </div>
            )}
            <button onClick={() => addCarton(p.ref)} title={moq > 1 ? `Ajouter 1 carton (${moq} u. \u00b7 ${(unitPrice * moq).toFixed(2)} \u20ac HT)` : 'Ajouter 1 unit\u00e9'} className="w-8 h-8 rounded-lg bg-gold-500 text-white hover:bg-gold-600 flex items-center justify-center text-sm font-bold transition-colors">+</button>
          </div>
        </div>
      );
    };

    const AmenitiesSection = ({ amenities, catalogue, panier, setPanier }) => {
      if (!amenities || Object.keys(amenities).length === 0) return null;
      const [showBidons, setShowBidons] = useState(true);
      const [showFlacons, setShowFlacons] = useState(false);

      const sections = AMENITY_TYPES
        .filter(type => amenities[type.key])
        .map(type => {
          const baseRef = amenities[type.key];
          const gammeInfo = type.gammes.find(g => g.ref === baseRef);
          const allProducts = catalogue.filter(p => p.ref === baseRef || p.ref.startsWith(baseRef + '-'));
          const fiveLProducts = allProducts.filter(p => is5L(p.ref, baseRef));
          const flaconProducts = allProducts.filter(p => !is5L(p.ref, baseRef));
          return { type, baseRef, gammeInfo, fiveLProducts, flaconProducts };
        })
        .filter(s => s.fiveLProducts.length > 0 || s.flaconProducts.length > 0);

      if (sections.length === 0) return null;

      const hasFlacons = sections.some(s => s.flaconProducts.length > 0);

      const getQty = (ref) => panier[ref]?.quantite || 0;

      const addCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        setPanier(p => ({ ...p, [ref]: { ...prod, quantite: getQty(ref) + moq } }));
      };

      const removeCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const next = getQty(ref) - moq;
        if (next <= 0) {
          setPanier(p => { const n = { ...p }; delete n[ref]; return n; });
        } else {
          setPanier(p => ({ ...p, [ref]: { ...prod, quantite: next } }));
        }
      };

      return (
        <div className="mb-8 space-y-6">
          {/* Section principale : bidons 5L */}
          <div>
            <button
              onClick={() => setShowBidons(!showBidons)}
              className="flex items-center gap-2 mb-4 group"
            >
              <div className="w-1 h-5 bg-gold-500 rounded-full"></div>
              <h3 className="text-sm font-semibold text-gray-900 dark:text-white group-hover:text-gold-700 dark:group-hover:text-gold-400 transition-colors">Vos produits en chambre</h3>
              <span className="text-gray-400 dark:text-slate-500 text-xs group-hover:text-gray-600 dark:group-hover:text-slate-300 transition-colors">{showBidons ? '\u25b2' : '\u25bc'}</span>
            </button>
            {showBidons && (
            <div className="space-y-4 animate-fade-in">
              {sections.map(({ type, gammeInfo, fiveLProducts }) => (
                fiveLProducts.length > 0 && (
                  <div key={type.key} className="bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 rounded-xl overflow-hidden">
                    <div className="px-3 py-1.5 bg-gray-50 dark:bg-slate-700 border-b border-gray-100 dark:border-slate-700 flex items-center gap-1.5">
                      <span className="text-xs font-semibold text-gray-700 dark:text-slate-200">{type.label}</span>
                      <span className="text-xs text-gold-600">{gammeInfo?.gamme || ''}</span>
                    </div>
                    <div className="divide-y divide-gray-50 dark:divide-slate-700">
                      {fiveLProducts.map(p => (
                        <AmenityProductRow key={p.ref} p={p} getQty={getQty} addCarton={addCarton} removeCarton={removeCarton} />
                      ))}
                    </div>
                  </div>
                )
              ))}
            </div>
            )}
          </div>

          {/* Section déroulante : flacons 500ml + autres formats */}
          {hasFlacons && (
            <div>
              <button
                onClick={() => setShowFlacons(!showFlacons)}
                className="flex items-center gap-2 mb-3 group"
              >
                <div className="w-1 h-5 bg-gray-300 dark:bg-slate-500 rounded-full"></div>
                <h3 className="text-sm font-medium text-gray-500 dark:text-slate-400 group-hover:text-gray-700 dark:group-hover:text-slate-200 transition-colors">Flacons 500 ml &amp; autres formats <span className="font-normal text-gray-400 dark:text-slate-500">(m&ecirc;mes parfums)</span></h3>
                <span className="text-gray-400 dark:text-slate-500 text-xs group-hover:text-gray-600 dark:group-hover:text-slate-300 transition-colors">{showFlacons ? '\u25b2' : '\u25bc'}</span>
              </button>
              {showFlacons && (
                <div className="space-y-4 animate-fade-in">
                  {sections.map(({ type, gammeInfo, flaconProducts }) => (
                    flaconProducts.length > 0 && (
                      <div key={type.key} className="bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 rounded-xl overflow-hidden">

    // ─── Catalogue ──────────────────────────────────────────────────────────────
    const CATEGORY_DISPLAY_NAMES = {

    const QUICK_ACCESS_CATS = [

    const CatalogueView = ({ catalogue, panier, setPanier }) => {

      const filtered = useMemo(() => {

        const ordered = [];
        for (const cat of CATEGORIES_ORDER) {

        for (const cat of Object.keys(groups)) {
          if (!CATEGORIES_ORDER.includes(cat)) ordered.push({ categorie: cat, products: groups[cat] });
        }
        return ordered;
      }, [filtered]);

      useEffect(() => {
        if (search && search.length >= 2) {
          setOpenCats(prev => {
            const next = { ...prev };

      const getQty = (ref) => panier[ref]?.quantite || 0;

        const current = getQty(ref);
        setPanier(p => ({ ...p, [ref]: { ...prod, quantite: current + moq } }));

        const current = getQty(ref);

      const panierCountByCat = useMemo(() => {
        const counts = {};
        for (const ref of Object.keys(panier)) {

      return (
        <div>
          {/* Barre de recherche */}

                <button onClick={() => setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-slate-500 hover:text-gray-600 dark:hover:text-slate-300 text-lg px-1">&times;</button>

          {/* Raccourcis rapides */}
          {!search && (
            <div className="flex flex-wrap gap-2 mb-4">

                <button key={c.match} onClick={() => {

                  <span className="text-sm font-semibold text-gray-900 dark:text-white flex-1 text-left">{displayCategory(categorie)}</span>
                  <span className="text-xs text-gray-400 dark:text-slate-500">{products.length}</span>
                  {catPanierCount > 0 && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium">{catPanierCount} au panier</span>

                          </div>
                        </div>
                      );

            );

    // ─── Panier Panel ───────────────────────────────────────────────────────────
    const PanierPanel = ({ panier, setPanier, onCommander, loading, partner, modifyingOrderId, initialNotes }) => {

      const [showConfirm, setShowConfirm] = useState(false);

      const items = Object.values(panier);
      const subtotalHT = items.reduce((s, i) => s + (i.prix_promo ?? i.prix_remise) * i.quantite, 0);
      const francoSeuil = partner.franco_seuil ?? 800;
      const globalExonere = partner.frais_exonere ?? 0;
      const exonereFP = globalExonere || (partner.exonere_fp ?? 0);
      const exonereFE = globalExonere || (partner.exonere_fe ?? 0);
      const exonere = exonereFP && exonereFE ? 1 : 0;
      const fpPrix = partner.fp_prix ?? 0;
      const fePrix = partner.fe_prix ?? 0;

      let fraisMontant = 0;
      let francoAtteint = subtotalHT >= francoSeuil;

      const totalHT = subtotalHT + fraisMontant;
      const tvaParProduit = items.reduce((s, i) => s + (i.prix_promo ?? i.prix_remise) * i.quantite * ((i.tva || 20) / 100), 0);
      const tvaSurFrais = fraisMontant * 0.2;
      const totalTTC = totalHT + tvaParProduit + tvaSurFrais;
      const manquePourFranco = Math.max(0, francoSeuil - subtotalHT);

      if (items.length === 0) {

              <ul className="list-disc list-inside space-y-0.5">
                <li>Franco port {francoSeuil.toFixed(0)} &euro; HT en France et 1&nbsp;500 &euro; HT &agrave; l'&eacute;tranger</li>
                {!exonereFE && <li>Sous le franco : frais d'exp&eacute;dition {fePrix > 0 ? fePrix.toFixed(0) : '80'} &euro; HT (FP inclus)</li>}
                {!exonereFP && <li>Au-dessus du franco : frais de pr&eacute;paration r&eacute;duits &agrave; {fpPrix > 0 ? fpPrix.toFixed(0) : '25'} &euro; HT</li>}
                {!!(exonereFE && exonereFP) && <li>Exon&eacute;r&eacute; de frais de port et de pr&eacute;paration</li>}
                <li>Conditionnement : bidons par cartons de 4, flacons par cartons de 6.</li>
              </ul>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-4">
          {items.map(i => {
            const moq = i.moq || 1;
            const cartons = moq > 1 ? Math.floor(i.quantite / moq) : i.quantite;
            return (
              <div key={i.ref} className="bg-gray-50 dark:bg-slate-700 rounded-xl p-3">
                <div className="flex items-center justify-between">
                  <div className="min-w-0 flex-1">
                    <div className="text-xs text-gray-400 dark:text-slate-500 font-mono">{i.ref}</div>
                    <div className="text-sm text-gray-900 dark:text-white truncate">{i.nom}</div>
                    <div className="flex items-center gap-2 mt-0.5">
                      {i.promo_pct > 0 ? (
                        <>
                          <span className="text-xs text-gray-400 dark:text-slate-500 line-through">{i.prix_remise.toFixed(2)} &euro;</span>
                          <span className="text-xs font-bold text-red-600 dark:text-red-400">{i.prix_promo.toFixed(2)} &euro; HT/u</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500 text-white font-bold">-{i.promo_pct}%</span>
                        </>
                      ) : i.discount_pct > 0 ? (
                        <>
                          <span className="text-xs text-gray-400 dark:text-slate-500 line-through">{i.prix_ht.toFixed(2)} &euro;</span>
                          <span className="text-xs text-gold-600">{i.prix_remise.toFixed(2)} &euro; HT/u</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium">-{i.discount_pct}%</span>
                        </>
                      ) : (
                        <span className="text-xs text-gray-500 dark:text-slate-400">{i.prix_remise.toFixed(2)} &euro; HT/u</span>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-3 ml-3">
                    <div className="flex items-center gap-1">
                      <button onClick={() => setPanier(p => {
                        const next = i.quantite - moq;
                        if (next <= 0) { const n = { ...p }; delete n[i.ref]; return n; }
                        return { ...p, [i.ref]: { ...i, quantite: next } };
                      })} className="w-8 h-8 rounded-lg bg-gray-200 dark:bg-slate-600 text-gray-600 dark:text-slate-300 text-sm hover:bg-gray-300 dark:hover:bg-slate-500 flex items-center justify-center">-</button>
                      <div className="text-center min-w-[32px]">
                        <div className="text-gray-900 dark:text-white text-sm font-semibold">{moq > 1 ? cartons : i.quantite}</div>
                        {moq > 1 && <div className="text-[9px] text-gray-400 dark:text-slate-500 leading-none">{i.quantite} u.</div>}
                      </div>
                      <button onClick={() => setPanier(p => ({ ...p, [i.ref]: { ...i, quantite: i.quantite + moq } }))} className="w-8 h-8 rounded-lg bg-gray-200 dark:bg-slate-600 text-gray-600 dark:text-slate-300 text-sm hover:bg-gray-300 dark:hover:bg-slate-500 flex items-center justify-center">+</button>
                    </div>
                    <div className="text-sm text-gray-900 dark:text-white font-medium w-20 text-right">{((i.prix_promo ?? i.prix_remise) * i.quantite).toFixed(2)} &euro;</div>
                  </div>
                </div>
              </div>
            );
          })}

          {/* Barre de progression franco */}
          {(!exonereFE || !exonereFP) && (
            <div className="bg-gray-50 dark:bg-slate-700 rounded-xl p-3">
              <div className="flex justify-between text-[11px] mb-1.5">
                <span className={francoAtteint ? "text-gold-600 font-medium" : "text-gray-500 dark:text-slate-400"}>
                  {francoAtteint
                    ? (exonereFP ? 'Franco atteint \u2014 pas de frais' : `Franco atteint \u2014 frais r\u00e9duits \u00e0 ${fpPrix.toFixed(0)} \u20ac HT`)
                    : (exonereFE ? `Encore ${manquePourFranco.toFixed(2)} \u20ac pour le franco (pas de frais d'exp\u00e9dition)` : `Encore ${manquePourFranco.toFixed(2)} \u20ac pour le franco`)}
                </span>
                <span className="text-gray-400 dark:text-slate-500">{subtotalHT.toFixed(0)} / {francoSeuil.toFixed(0)} &euro; HT</span>
              </div>
              <div className="w-full bg-gray-200 dark:bg-slate-600 rounded-full h-1.5">
                <div
                  className={`h-1.5 rounded-full transition-all ${francoAtteint ? 'bg-gold-500' : 'bg-amber-500'}`}
                  style={{ width: `${Math.min(100, (subtotalHT / francoSeuil) * 100)}%` }}
                />
              </div>
              <div className="text-[10px] mt-1 text-gray-400 dark:text-slate-500">
                {!exonereFE && !exonereFP && (<>Sous {francoSeuil.toFixed(0)} &euro; : exp&eacute;dition {fePrix.toFixed(0)} &euro; HT &middot; Au-dessus : r&eacute;duits &agrave; {fpPrix.toFixed(0)} &euro; HT</>)}
                {exonereFE && !exonereFP && (<>Au-dessus du franco : frais de pr&eacute;paration {fpPrix.toFixed(0)} &euro; HT</>)}
                {!exonereFE && exonereFP && (<>Sous {francoSeuil.toFixed(0)} &euro; : exp&eacute;dition {fePrix.toFixed(0)} &euro; HT</>)}
              </div>
            </div>
          )}

          <div className="border-t border-gray-200 dark:border-slate-600 pt-4 space-y-2">
            <div className="flex justify-between text-sm text-gray-500 dark:text-slate-400">
              <span>Sous-total HT</span>
              <span>{subtotalHT.toFixed(2)} &euro;</span>
            </div>
            {fraisMontant > 0 && (
              <div className={`flex justify-between text-sm ${francoAtteint ? 'text-gold-600' : 'text-amber-600'}`}>
                <span>{fraisLabel}</span>
                <span>{fraisMontant.toFixed(2)} &euro;</span>
              </div>
            )}
            {fraisMontant === 0 && !exonere && (francoAtteint ? exonereFP : exonereFE) && (
              <div className="flex justify-between text-sm text-emerald-600">
                <span>{francoAtteint ? 'Frais de préparation' : "Frais d'expédition"}</span>
                <span>Exon&eacute;r&eacute;</span>
              </div>
            )}
            {exonere === 1 && (
              <div className="flex justify-between text-sm text-emerald-600">
                <span>Frais</span>
                <span>Exon&eacute;r&eacute;</span>
              </div>
            )}
            <div className="flex justify-between text-sm text-gray-900 dark:text-white font-semibold">
              <span>Total HT</span>
              <span>{totalHT.toFixed(2)} &euro;</span>
            </div>
            <div className="flex justify-between text-sm text-gray-400 dark:text-slate-500">
              <span>Total TTC</span>
              <span>{totalTTC.toFixed(2)} &euro;</span>
            </div>
          </div>
          <div className="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 rounded-xl p-3 text-xs text-amber-800 dark:text-amber-300 space-y-1">
            <div className="font-semibold text-amber-900 dark:text-amber-400 mb-1">Conditions :</div>
            <ul className="list-disc list-inside space-y-0.5">
              <li>Franco port {francoSeuil.toFixed(0)} &euro; HT en France et 1&nbsp;500 &euro; HT &agrave; l'&eacute;tranger</li>
              {!exonereFE && <li>Sous le franco : frais d'exp&eacute;dition {fePrix > 0 ? fePrix.toFixed(0) : '80'} &euro; HT (FP inclus)</li>}
              {!exonereFP && <li>Au-dessus du franco : frais de pr&eacute;paration r&eacute;duits &agrave; {fpPrix > 0 ? fpPrix.toFixed(0) : '25'} &euro; HT</li>}
              {!!(exonereFE && exonereFP) && <li>Exon&eacute;r&eacute; de frais de port et de pr&eacute;paration</li>}
              <li>Conditionnement : bidons par cartons de 4, flacons par cartons de 6.</li>
            </ul>
          </div>
          <textarea
            value={notes}
            onChange={e => setNotes(e.target.value)}
            placeholder="Notes ou instructions (optionnel)..."
            className="w-full bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-gold-500/50 resize-none"
            rows={3}
          />

          {/* Ecran de confirmation (point 6) */}
          {showConfirm ? (
            <div ref={confirmRef} className="bg-gold-50 dark:bg-gold-900/30 border border-gold-200 dark:border-gold-800 rounded-xl p-4 space-y-3 animate-fade-in">
              <div className="text-sm font-semibold text-gray-900 dark:text-white">R&eacute;capitulatif de votre commande</div>
              <div className="space-y-1 max-h-40 overflow-y-auto">
                {items.map(i => (
                  <div key={i.ref} className="flex justify-between text-xs text-gray-700 dark:text-slate-200">
                    <span>{i.quantite}x {i.nom}</span>
                    <span>{((i.prix_promo ?? i.prix_remise) * i.quantite).toFixed(2)} &euro;</span>
                  </div>
                ))}
              </div>
              <div className="border-t border-gold-200 dark:border-gold-800 pt-2 space-y-1">
                {!exonere && fraisMontant > 0 && (
                  <div className="flex justify-between text-xs text-gray-500 dark:text-slate-400">
                    <span>{fraisLabel}</span>
                    <span>{fraisMontant.toFixed(2)} &euro;</span>
                  </div>
                )}
                <div className="flex justify-between text-sm font-semibold text-gray-900 dark:text-white">
                  <span>Total HT</span>
                  <span>{totalHT.toFixed(2)} &euro;</span>
                </div>
                <div className="flex justify-between text-xs text-gray-400 dark:text-slate-500">
                  <span>Total TTC</span>
                  <span>{totalTTC.toFixed(2)} &euro;</span>
                </div>
              </div>
              {notes && <div className="text-xs text-gray-500 dark:text-slate-400 italic">Note : "{notes}"</div>}
              <div className="flex gap-2">
                <button
                  onClick={() => setShowConfirm(false)}
                  className="flex-1 py-2.5 rounded-xl text-sm font-medium border border-gray-200 dark:border-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors"
                >
                  Modifier
                </button>
                <button
                  onClick={() => { setShowConfirm(false); onCommander(notes); }}
                  disabled={loading}
                  className="flex-1 bg-gold-500 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-gold-600 transition-colors disabled:opacity-50"
                >
                  {loading ? "Envoi..." : "Confirmer"}
                </button>
              </div>
            </div>
          ) : (
            <button
              onClick={() => { setShowConfirm(true); setTimeout(() => confirmRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); }}
              disabled={loading}
              className="w-full bg-gold-500 text-white py-3 rounded-xl text-sm font-semibold hover:bg-gold-600 transition-colors disabled:opacity-50"
            >
              {loading ? "Envoi en cours..." : modifyingOrderId ? `Enregistrer les modifications (${totalHT.toFixed(2)} \u20ac HT)` : `Commander (${totalHT.toFixed(2)} \u20ac HT)`}
            </button>
          )}
        </div>
      );
    };

    // ─── Historique ─────────────────────────────────────────────────────────────
    const HistoriqueView = ({ commandes, onRefresh, catalogue, setPanier, setPanierOpen, setVue, setModifyingOrderId, setModifyingNotes, showToast, partner, isMaster }) => {
      const [cancelling, setCancelling] = useState(null);
      const [filtre, setFiltre] = useState('tous');
      const [expandedId, setExpandedId] = useState(null);
      const [pageSize] = useState(20);
      const [visibleCount, setVisibleCount] = useState(20);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const toggleSelect = (id) => setSelectedIds(prev => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });
      const statutConfig = {
        en_attente: { label: "En attente", bg: "bg-amber-50 dark:bg-amber-900/30", text: "text-amber-700 dark:text-amber-300" },
        validee: { label: "Valid\u00e9e", bg: "bg-green-50 dark:bg-green-900/30", text: "text-green-700 dark:text-green-400" },
        annulee: { label: "Annul\u00e9e", bg: "bg-red-50 dark:bg-red-900/30", text: "text-red-700 dark:text-red-400" },
        annulee_client: { label: "Annul\u00e9e", bg: "bg-red-50 dark:bg-red-900/30", text: "text-red-700 dark:text-red-400" },
      };

      const handleCancel = async (id) => {
        if (!confirm('Annuler cette commande ?')) return;
        setCancelling(id);
        try {
          const res = await api.del(`/commande/${id}`);
          if (res.erreur) { showToast(res.erreur, 'error'); }
          else { showToast('Commande annul\u00e9e', 'success'); onRefresh(); }
        } catch (e) { showToast('Erreur annulation', 'error'); }
        setCancelling(null);
      };

      const handleModify = (c) => {
        const newPanier = {};
        c.products.forEach(p => {
          const prod = catalogue.find(cat => cat.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          } else {
            newPanier[p.ref] = { ref: p.ref, nom: p.nom, prix_ht: p.prix_ht, prix_remise: p.prix_remise, discount_pct: p.discount_pct || 0, moq: 1, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setModifyingOrderId(c.id);
        setModifyingNotes(c.notes || "");
        setPanierOpen(true);
        setVue('catalogue');
        showToast('Commande charg\u00e9e dans le panier \u2014 validez pour enregistrer les modifications', 'info');
      };

      const handleReorder = (c) => {
        const newPanier = {};
        c.products.forEach(p => {
          const prod = catalogue.find(cat => cat.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          } else {
            newPanier[p.ref] = { ref: p.ref, nom: p.nom, prix_ht: p.prix_ht, prix_remise: p.prix_remise, discount_pct: p.discount_pct || 0, tva: p.tva || 20, moq: 1, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setPanierOpen(true);
        setVue('catalogue');
        showToast('Panier rempli \u2014 vous pouvez ajuster avant de commander', 'success');
      };

      const exportCsv = () => {
        const toExport = selectedIds.size > 0 ? commandes.filter(c => selectedIds.has(c.id)) : commandes;
        if (toExport.length === 0) { showToast('Aucune commande \u00e0 exporter', 'error'); return; }
        const header = isMaster
          ? ['Date', '\u00c9tablissement', 'Statut', 'Facture', 'R\u00e9f\u00e9rence', 'Produit', 'Quantit\u00e9', 'Prix unitaire HT', 'Total ligne HT', 'Total commande HT', 'Total commande TTC', 'Notes']
          : ['Date', 'Statut', 'Facture', 'R\u00e9f\u00e9rence', 'Produit', 'Quantit\u00e9', 'Prix unitaire HT', 'Total ligne HT', 'Total commande HT', 'Total commande TTC', 'Notes'];
        const rows = [header];
        for (const c of toExport) {
          const cfg = statutConfig[c.statut] || {};
          const date = new Date(c.created_at).toLocaleDateString('fr-FR');
          for (const p of c.products) {
            const row = [
              date,
              ...(isMaster ? [(c.etablissement_nom || '').replace(/"/g, '""')] : []),
              cfg.label || c.statut,
              c.vf_invoice_number || '',
              p.ref,
              (p.nom || '').replace(/"/g, '""'),
              p.quantite,
              p.prix_remise.toFixed(2),
              p.total_ht.toFixed(2),
              c.total_ht.toFixed(2),
              c.total_ttc.toFixed(2),
              (c.notes || '').replace(/"/g, '""'),
            ];
            rows.push(row);
          }
        }
        const csv = rows.map(r => r.map(v => `"${v}"`).join(';')).join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `commandes-${partner.nom || 'export'}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`${toExport.length} commande${toExport.length > 1 ? 's' : ''} export\u00e9e${toExport.length > 1 ? 's' : ''}`, 'success');
        setSelectedIds(new Set());
      };

      const filtreOptions = [
        { key: 'tous', label: 'Toutes' },
        { key: 'en_attente', label: 'En attente' },
        { key: 'validee', label: 'Valid\u00e9es' },
        { key: 'annulee', label: 'Annul\u00e9es' },
      ];

      const filtered = filtre === 'tous'
        ? commandes
        : commandes.filter(c => filtre === 'annulee' ? (c.statut === 'annulee' || c.statut === 'annulee_client') : c.statut === filtre);

      const handleDownloadPdf = async (c) => {
        try {
          const res = await fetch(`${API_BASE}/commande/${c.id}/pdf`, { headers: window.partnerApi._headers() });
          if (!res.ok) { showToast('Facture non disponible', 'error'); return; }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `facture-${c.vf_invoice_number || c.id}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {
          showToast('Erreur t\u00e9l\u00e9chargement facture', 'error');
        }
      };

      if (commandes.length === 0) {
        return <div className="text-center py-12 text-gray-400 dark:text-slate-500 text-sm">Aucune commande pass&eacute;e.</div>;
      }

      return (
        <div className="space-y-4">
          {/* Filtres par statut */}
          <div className="flex gap-1 bg-gray-100 dark:bg-slate-600 rounded-xl p-1">
            {filtreOptions.map(f => {
              const count = f.key === 'tous' ? commandes.length
                : f.key === 'annulee' ? commandes.filter(c => c.statut === 'annulee' || c.statut === 'annulee_client').length
                : commandes.filter(c => c.statut === f.key).length;
              return (
                <button key={f.key} onClick={() => setFiltre(f.key)}
                  className={`flex-1 px-3 py-2 rounded-lg text-xs font-medium transition-colors ${filtre === f.key ? 'bg-white dark:bg-slate-800 shadow-sm dark:shadow-none text-gray-900 dark:text-white' : 'text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200'}`}>
                  {f.label} <span className="text-gray-400 dark:text-slate-500 ml-0.5">({count})</span>
                </button>
              );
            })}
          </div>

          {/* Barre d'actions export */}
          <div className="flex items-center justify-between">
            <div className="text-xs text-gray-400 dark:text-slate-500">
              {selectedIds.size > 0 && `${selectedIds.size} s\u00e9lectionn\u00e9e${selectedIds.size > 1 ? 's' : ''}`}
            </div>
            <div className="flex items-center gap-2">
              {selectedIds.size > 0 && (
                <button onClick={() => setSelectedIds(new Set())} className="text-xs text-gray-400 dark:text-slate-500 hover:text-gray-600 dark:hover:text-slate-300 transition-colors">
                  D&eacute;s&eacute;lectionner
                </button>
              )}
              <button onClick={exportCsv}
                className="text-xs px-3 py-2 rounded-lg border border-gray-200 dark:border-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors flex items-center gap-1">
                &#128196; Exporter {selectedIds.size > 0 ? `(${selectedIds.size})` : 'tout'} en CSV
              </button>
            </div>
          </div>

          {filtered.length === 0 && (
            <div className="text-center py-8 text-gray-400 dark:text-slate-500 text-sm">Aucune commande dans cette cat&eacute;gorie.</div>
          )}

          {filtered.slice(0, visibleCount).map(c => {
            const cfg = statutConfig[c.statut] || statutConfig.en_attente;
            const isExpanded = expandedId === c.id;
            const isSelected = selectedIds.has(c.id);
            return (
              <div key={c.id} className={`bg-white dark:bg-slate-800 border rounded-2xl shadow-sm dark:shadow-none overflow-hidden transition-colors ${isSelected ? 'border-gold-400 dark:border-gold-700 ring-1 ring-gold-200 dark:ring-gold-800' : 'border-gray-200 dark:border-slate-600'}`}>
                {/* En-tête cliquable */}
                <div className="flex items-center">
                  <label className="flex items-center justify-center w-10 shrink-0 cursor-pointer" onClick={e => e.stopPropagation()}>
                    <input type="checkbox" checked={isSelected} onChange={() => toggleSelect(c.id)}
                      className="w-4 h-4 rounded border-gray-300 dark:border-slate-600 text-gold-500 focus:ring-gold-500/30 cursor-pointer" />
                  </label>
                <button onClick={() => setExpandedId(isExpanded ? null : c.id)} className="flex-1 flex items-center justify-between p-4 pl-0 text-left hover:bg-gray-50/50 dark:hover:bg-slate-700/50 transition-colors">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <span className="text-xs text-gray-500 dark:text-slate-400">{new Date(c.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                      {isMaster && c.etablissement_nom && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400">{c.etablissement_nom}</span>}
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-medium ${cfg.bg} ${cfg.text}`}>{cfg.label}</span>
                      {c.statut === 'validee' && c.delivered_at && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400">Livr&eacute;e</span>}

        // Livraison (pré-rempli depuis facturation si vide)

        livraison_nom: partner.livraison_nom || defaultNom,
        livraison_rue: partner.livraison_rue || fRue,
        livraison_code_postal: partner.livraison_code_postal || fCp,

        livraison_portable: partner.livraison_portable || partner.facturation_portable || '',
        livraison_email: partner.livraison_email || partner.email || '',
      });
      const [saving, setSaving] = useState(false);
      const [pendingChange, setPendingChange] = useState(null);

      // Charger le profil complet au montage (le login ne renvoie qu'un sous-ensemble)

          setPartner(p);
          const np = (p.contact_nom || '').trim().split(/\s+/);
          const dp = np.length > 1 ? np.slice(0, -1).join(' ') : np[0] || '';
          const dn = np.length > 1 ? np[np.length - 1] : '';
          let fr = '', fc = '', fv = '';
          if (!p.facturation_rue && !p.facturation_code_postal && !p.facturation_ville && p.adresse) {
            const pts = p.adresse.split(',').map(s => s.trim());
            if (pts.length >= 3) { fr = pts[0]; fc = pts[1]; fv = pts[2]; }
            else if (pts.length === 2) { fr = pts[0]; fv = pts[1]; }
            else { fr = pts[0]; }
          }
          const rue = p.facturation_rue || fr;
          const cp = p.facturation_code_postal || fc;
          const ville = p.facturation_ville || fv;
          const pays = p.facturation_pays || '';
          setForm({
            contact_nom: p.contact_nom || '',
            facturation_tva: p.facturation_tva || '',
            facturation_entite_publique: p.facturation_entite_publique || 0,
            facturation_rue: rue, facturation_code_postal: cp, facturation_ville: ville, facturation_pays: pays,
            telephone: p.telephone || '', facturation_portable: p.facturation_portable || '',
            email: p.email || '', facturation_email: p.facturation_email || p.email || '',
            livraison_prenom: p.livraison_prenom || dp, livraison_nom: p.livraison_nom || dn,
            livraison_rue: p.livraison_rue || rue, livraison_code_postal: p.livraison_code_postal || cp,
            livraison_ville: p.livraison_ville || ville, livraison_pays: p.livraison_pays || pays,
            livraison_telephone: p.livraison_telephone || p.telephone || '',
            livraison_portable: p.livraison_portable || p.facturation_portable || '',
            livraison_email: p.livraison_email || p.email || '',
          });
        }).catch(() => {});
        api.get('/profil/pending').then(data => setPendingChange(data)).catch(() => {});
      }, []);
