<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Terre de Mars — Espace Partenaire</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23A28E3F'/><text x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='13' fill='white'>TM</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Nettoyer les paramètres tracking Brevo (?_se=...) de l'URL
    if (window.location.search.includes('_se=')) {
      const url = new URL(window.location);
      url.searchParams.delete('_se');
      window.history.replaceState({}, '', url.pathname + (url.search || ''));
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#F9F7F1',
              100: '#F1EDDD',
              200: '#E3DCC0',
              300: '#D1C79F',
              400: '#B9AA6F',
              500: '#A28E3F',
              600: '#877633',
              700: '#6C5E29',
              800: '#51461F',
              900: '#362F15',
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tache {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .tache-1 {
      top: -40px;
      right: -30px;
      width: 420px;
      height: 420px;
      background: radial-gradient(ellipse at 45% 45%, rgba(162,142,63,0.18) 0%, rgba(162,142,63,0.08) 35%, transparent 65%);
      border-radius: 42% 58% 55% 45% / 50% 42% 58% 50%;
      transform: rotate(-15deg);
    }
    .tache-2 {
      bottom: 5%;
      left: -40px;
      width: 360px;
      height: 360px;
      background: radial-gradient(ellipse at 55% 50%, rgba(162,142,63,0.14) 0%, rgba(162,142,63,0.06) 35%, transparent 65%);
      border-radius: 55% 45% 48% 52% / 45% 55% 45% 55%;
      transform: rotate(10deg);
    }
    .tache-3 {
      top: 40%;
      right: 5%;
      width: 300px;
      height: 300px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.10) 0%, rgba(162,142,63,0.04) 35%, transparent 60%);
      border-radius: 48% 52% 45% 55% / 52% 48% 52% 48%;
      transform: rotate(25deg);
    }
    .tache-login-1 {
      top: 10%;
      right: 5%;
      width: 45vw;
      height: 45vw;
      max-width: 550px;
      max-height: 550px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.20) 0%, rgba(162,142,63,0.10) 30%, rgba(162,142,63,0.03) 55%, transparent 70%);
      border-radius: 42% 58% 52% 48% / 48% 42% 58% 52%;
      transform: rotate(-10deg);
    }
    .tache-login-2 {
      bottom: 8%;
      left: 3%;
      width: 40vw;
      height: 40vw;
      max-width: 480px;
      max-height: 480px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.16) 0%, rgba(162,142,63,0.07) 35%, transparent 65%);
      border-radius: 55% 45% 48% 52% / 52% 55% 45% 48%;
      transform: rotate(20deg);
    }
    html.dark body { background: #0f172a; }
    .dark .tache-1, .dark .tache-2, .dark .tache-3 { opacity: 0.3; }
    .dark .tache-login-1, .dark .tache-login-2 { opacity: 0.3; }
  </style>
</head>
<body>
  <script>if (localStorage.getItem('tdm_dark_mode') === 'true') document.documentElement.classList.add('dark');</script>
  <div id="root"></div>

  <script>
    const API_BASE = window.location.origin + '/api/partenaire';

    window.partnerApi = {
      _headers: () => {
        const token = sessionStorage.getItem('partner_token') || '';
        const h = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        const actingAs = sessionStorage.getItem('partner_acting_as');
        if (actingAs) h['X-Acting-Partner-Id'] = actingAs;
        return h;
      },
      _handle: (r) => {
        if (r.status === 401) { sessionStorage.removeItem('partner_token'); window.location.reload(); throw new Error('Session expirée'); }
        return r.json();
      },
      get: (path) => fetch(API_BASE + path, { headers: window.partnerApi._headers() }).then(window.partnerApi._handle),
      post: (path, body) => fetch(API_BASE + path, { method: 'POST', headers: window.partnerApi._headers(), body: JSON.stringify(body) }).then(window.partnerApi._handle),
      patch: (path, body) => fetch(API_BASE + path, { method: 'PATCH', headers: window.partnerApi._headers(), body: JSON.stringify(body) }).then(window.partnerApi._handle),
      del: (path) => fetch(API_BASE + path, { method: 'DELETE', headers: window.partnerApi._headers() }).then(window.partnerApi._handle),
    };
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const api = window.partnerApi;
    const normalizeText = (str) => str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    // ─── Toast ──────────────────────────────────────────────────────────────────
    const Toast = ({ toast }) => {
      if (!toast || !toast.visible) return null;
      const colors = { success: "bg-green-600", error: "bg-red-500", info: "bg-gray-800" };
      return (
        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-white text-sm font-medium animate-fade-in ${colors[toast.type] || colors.info}`}>
          {toast.type === "success" && "\u2713 "}{toast.type === "error" && "\u2717 "}{toast.message}
        </div>
      );
    };

    // ─── Login Screen ───────────────────────────────────────────────────────────
    const LoginScreen = ({ onLogin }) => {
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleLogin = async () => {
        if (!password.trim()) return;
        setLoading(true);
        setError("");
        try {
          const res = await api.post('/login', { password: password.trim() });
          if (res.erreur) {
            setError(res.erreur);
          } else if (res.token) {
            sessionStorage.setItem('partner_token', res.token);
            onLogin(res);
          }
        } catch (e) {
          setError("Impossible de contacter le serveur");
        }
        setLoading(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
          <div className="tache tache-login-1"></div>
          <div className="tache tache-login-2"></div>
          <div className="relative z-10 w-full max-w-sm animate-fade-in text-center">
            <div className="mb-10">
              <img src="/logo-tdm-anim.gif" alt="Terre de Mars" className="h-24 mx-auto mb-6" />
            </div>
            <div className="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-2xl p-8 shadow-sm dark:shadow-none">
              <h2 className="text-sm font-medium text-gray-700 dark:text-slate-200 mb-1">Espace Partenaire</h2>
              <p className="text-xs text-gray-400 dark:text-slate-500 mb-6">Entrez votre mot de passe pour acc&eacute;der au catalogue.</p>
              <input
                type="password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                placeholder="Mot de passe..."
                className="w-full bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-gold-500/50 focus:border-gold-500/40"
                autoFocus
              />
              {error && <p className="text-red-500 text-xs mt-2">{error}</p>}
              <button
                onClick={handleLogin}
                disabled={loading}
                className="w-full mt-4 bg-gold-500 text-white py-3 rounded-xl text-sm font-medium hover:bg-gold-600 transition-colors disabled:opacity-50"
              >
                {loading ? "Connexion..." : "Acc\u00e9der"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ─── Constantes amenities ─────────────────────────────────────────────────
    const AMENITY_TYPES = [
      { key: 'gel_douche', label: 'Gel douche', gammes: [
        { ref: 'P008', gamme: 'Verveine / Reddition' },
        { ref: 'P035', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'shampoing', label: 'Shampoing', gammes: [
        { ref: 'P019', gamme: 'Verveine / Reddition' },
        { ref: 'P010', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P034', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'gel_corps_cheveux', label: 'Gel Corps & Cheveux', gammes: [
        { ref: 'P042', gamme: 'Verveine / Reddition' },
        { ref: 'P014', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P040', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'apres_shampoing', label: 'Apr\u00e8s-shampoing', gammes: [
        { ref: 'P024', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P037', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'lotion', label: 'Lotion Corps & Main', gammes: [
        { ref: 'P036', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
        { ref: 'P011', gamme: 'V\u00e9tiver / Imminence' },
      ]},
      { key: 'savon_main', label: 'Savon Liquide Main', gammes: [
        { ref: 'P007', gamme: 'V\u00e9tiver / Insurrection' },
      ]},
    ];

    // ─── Section Amenities (produits en chambre) ──────────────────────────────
    const MAIN_SUFFIXES = ['', '-5000']; // 500ml (base ref) et 5L
    const isMainFormat = (ref, baseRef) => ref === baseRef || ref === baseRef + '-5000';

    const AmenityProductRow = ({ p, getQty, addCarton, removeCarton }) => {
      const moq = p.moq || 1;
      const qty = getQty(p.ref);
      const cartons = moq > 1 ? Math.floor(qty / moq) : qty;
      const inCart = qty > 0;
      return (
        <div className={`flex items-center gap-2 px-3 py-2.5 rounded-lg transition-colors ${inCart ? 'bg-gold-50 dark:bg-gold-900/30 border-l-2 border-l-gold-500' : 'hover:bg-gray-50 dark:hover:bg-slate-700'}`}>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className="font-mono text-[10px] text-gray-400 dark:text-slate-500 shrink-0">{p.ref}</span>
              <span className="text-xs sm:text-sm text-gray-900 dark:text-white truncate">{p.nom}</span>
            </div>
            <div className="flex items-center gap-2 mt-0.5 flex-wrap">
              {p.promo_pct > 0 ? (
                <>
                  <span className="text-xs text-gray-400 dark:text-slate-500 line-through">{p.prix_remise.toFixed(2)} &euro;</span>
                  <span className="text-xs font-bold text-red-600 dark:text-red-400">{p.prix_promo.toFixed(2)} &euro; HT/u</span>
                  <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500 text-white font-bold">-{p.promo_pct}%</span>
                </>
              ) : (
                <>
                  <span className="text-xs font-semibold text-gold-600">{p.prix_remise.toFixed(2)} &euro; HT/u</span>
                  {p.discount_pct > 0 && (
                    <span className="text-[10px] px-1 py-0.5 rounded bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium">-{p.discount_pct}%</span>
                  )}
                </>
              )}
            </div>
            {moq > 1 && (
              <div className="text-[10px] text-gray-500 dark:text-slate-400 mt-0.5">Carton de {moq} &middot; {((p.prix_promo ?? p.prix_remise) * moq).toFixed(2)} &euro; HT</div>
            )}
          </div>
          <div className="flex items-center gap-1 shrink-0">
            {qty > 0 && (
              <button onClick={() => removeCarton(p.ref)} className="w-9 h-9 rounded-lg bg-gray-100 dark:bg-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-500 flex items-center justify-center text-base font-bold transition-colors">-</button>
            )}
            {qty > 0 && (
              <div className="text-center min-w-[32px]">
                <div className="text-gray-900 dark:text-white font-semibold text-sm">{moq > 1 ? cartons : qty}</div>
                {moq > 1 && <div className="text-[9px] text-gray-400 dark:text-slate-500 leading-none">{qty} u.</div>}
              </div>
            )}
            <button onClick={() => addCarton(p.ref)} title={moq > 1 ? `Ajouter 1 carton (${moq} u. \u00b7 ${((p.prix_promo ?? p.prix_remise) * moq).toFixed(2)} \u20ac HT)` : 'Ajouter 1 unit\u00e9'} className="w-9 h-9 rounded-lg bg-gold-500 text-white hover:bg-gold-600 flex items-center justify-center text-base font-bold transition-colors">+</button>
          </div>
        </div>
      );
    };

    const AmenitiesSection = ({ amenities, catalogue, panier, setPanier }) => {
      if (!amenities || Object.keys(amenities).length === 0) return null;
      const [showOtherFormats, setShowOtherFormats] = useState(false);

      const sections = AMENITY_TYPES
        .filter(type => amenities[type.key])
        .map(type => {
          const baseRef = amenities[type.key];
          const gammeInfo = type.gammes.find(g => g.ref === baseRef);
          const allProducts = catalogue.filter(p => p.ref === baseRef || p.ref.startsWith(baseRef + '-'));
          const mainProducts = allProducts.filter(p => isMainFormat(p.ref, baseRef));
          const otherProducts = allProducts.filter(p => !isMainFormat(p.ref, baseRef));
          return { type, baseRef, gammeInfo, mainProducts, otherProducts };
        })
        .filter(s => s.mainProducts.length > 0 || s.otherProducts.length > 0);

      if (sections.length === 0) return null;

      const hasOtherFormats = sections.some(s => s.otherProducts.length > 0);

      const getQty = (ref) => panier[ref]?.quantite || 0;

      const addCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        setPanier(p => ({ ...p, [ref]: { ...prod, quantite: getQty(ref) + moq } }));
      };

      const removeCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const next = getQty(ref) - moq;
        if (next <= 0) {
          setPanier(p => { const n = { ...p }; delete n[ref]; return n; });
        } else {
          setPanier(p => ({ ...p, [ref]: { ...prod, quantite: next } }));
        }
      };

      return (
        <div className="mb-8 space-y-6">
          {/* Section principale : 500ml et 5L */}
          <div>
            <div className="flex items-center gap-2 mb-4">
              <div className="w-1 h-5 bg-gold-500 rounded-full"></div>
              <h3 className="text-sm font-semibold text-gray-900 dark:text-white">Vos produits en chambre</h3>
            </div>
            <div className="space-y-4">
              {sections.map(({ type, gammeInfo, mainProducts }) => (
                mainProducts.length > 0 && (
                  <div key={type.key} className="bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 rounded-xl overflow-hidden">
                    <div className="px-3 py-2 bg-gray-50 dark:bg-slate-700 border-b border-gray-100 dark:border-slate-700">
                      <span className="text-xs font-semibold text-gray-700 dark:text-slate-200">{type.label}</span>
                      <span className="text-xs text-gold-600 ml-1.5">{gammeInfo?.gamme || ''}</span>
                    </div>
                    <div className="divide-y divide-gray-50 dark:divide-slate-700">
                      {mainProducts.map(p => (
                        <AmenityProductRow key={p.ref} p={p} getQty={getQty} addCarton={addCarton} removeCarton={removeCarton} />
                      ))}
                    </div>
                  </div>
                )
              ))}
            </div>
          </div>

          {/* Section secondaire : autres formats */}
          {hasOtherFormats && (
            <div>
              <button
                onClick={() => setShowOtherFormats(!showOtherFormats)}
                className="flex items-center gap-2 mb-3 group"
              >
                <div className="w-1 h-5 bg-gray-300 dark:bg-slate-500 rounded-full"></div>
                <h3 className="text-sm font-medium text-gray-500 dark:text-slate-400 group-hover:text-gray-700 dark:group-hover:text-slate-200 transition-colors">Autres formats disponibles <span className="font-normal text-gray-400 dark:text-slate-500">(mêmes parfums)</span></h3>
                <span className="text-gray-400 dark:text-slate-500 text-xs group-hover:text-gray-600 dark:group-hover:text-slate-300 transition-colors">{showOtherFormats ? '\u25b2' : '\u25bc'}</span>
              </button>
              {showOtherFormats && (
                <div className="space-y-4 animate-fade-in">
                  {sections.map(({ type, gammeInfo, otherProducts }) => (
                    otherProducts.length > 0 && (
                      <div key={type.key} className="bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 rounded-xl overflow-hidden">
                        <div className="px-3 py-2 bg-gray-50 dark:bg-slate-700 border-b border-gray-100 dark:border-slate-700">
                          <span className="text-xs font-semibold text-gray-700 dark:text-slate-200">{type.label}</span>
                          <span className="text-xs text-gold-600 ml-1.5">{gammeInfo?.gamme || ''}</span>
                        </div>
                        <div className="divide-y divide-gray-50 dark:divide-slate-700">
                          {otherProducts.map(p => (
                            <AmenityProductRow key={p.ref} p={p} getQty={getQty} addCarton={addCarton} removeCarton={removeCarton} />
                          ))}
                        </div>
                      </div>
                    )
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ─── Section Derni\u00e8re Commande ────────────────────────────────────────────
    const DerniereCommandeSection = ({ commandes, catalogue, setPanier, setPanierOpen, showToast }) => {
      const [open, setOpen] = useState(false);
      if (!commandes || commandes.length === 0) return null;

      const derniere = commandes[0];

      const handleRecommander = () => {
        const newPanier = {};
        derniere.products.forEach(p => {
          const prod = catalogue.find(c => c.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setPanierOpen(true);
        showToast('Panier rempli avec votre derni\u00e8re commande', 'success');
      };

      const statutConfig = {
        en_attente: { label: "En attente", bg: "bg-amber-50 dark:bg-amber-900/30", text: "text-amber-700 dark:text-amber-300" },
        validee: { label: "Valid\u00e9e", bg: "bg-green-50 dark:bg-green-900/30", text: "text-green-700 dark:text-green-400" },
        annulee: { label: "Annul\u00e9e", bg: "bg-red-50 dark:bg-red-900/30", text: "text-red-700 dark:text-red-400" },
        annulee_client: { label: "Annul\u00e9e", bg: "bg-red-50 dark:bg-red-900/30", text: "text-red-700 dark:text-red-400" },
      };
      const cfg = statutConfig[derniere.statut] || statutConfig.en_attente;

      return (
        <div className="mb-8">
          <button
            onClick={() => setOpen(!open)}
            className="flex items-center gap-2 mb-3 group"
          >
            <div className="w-1 h-5 bg-gold-400 rounded-full"></div>
            <h3 className="text-sm font-semibold text-gray-900 dark:text-white">Votre dernière commande</h3>
            <span className="text-gray-400 dark:text-slate-500 text-xs group-hover:text-gray-600 dark:group-hover:text-slate-300 transition-colors">{open ? '\u25b2' : '\u25bc'}</span>
          </button>
          {open && (
            <div className="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-xl p-4 animate-fade-in shadow-sm dark:shadow-none">
              <div className="flex items-center justify-between mb-3">
                <div className="text-xs text-gray-500 dark:text-slate-400">
                  {new Date(derniere.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}
                </div>
                <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${cfg.bg} ${cfg.text}`}>{cfg.label}</span>
              </div>
              <div className="space-y-1 mb-3">
                {derniere.products.map((p, i) => (
                  <div key={i} className="flex justify-between text-sm">
                    <span className="text-gray-600 dark:text-slate-300">{p.quantite}x {p.nom || p.ref}</span>
                    <span className="text-gray-900 dark:text-white">{p.total_ht.toFixed(2)} &euro;</span>
                  </div>
                ))}
              </div>
              <div className="flex items-center justify-between border-t border-gray-100 dark:border-slate-700 pt-3">
                <div className="text-sm font-medium text-gray-900 dark:text-white">Total: {derniere.total_ht.toFixed(2)} &euro; HT</div>
                <button
                  onClick={handleRecommander}
                  className="px-4 py-2 bg-gold-500 text-white text-xs font-medium rounded-lg hover:bg-gold-600 transition-colors"
                >
                  Re-commander
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── Catalogue ──────────────────────────────────────────────────────────────
    const CATEGORIES_ORDER = [
      'Cadeaux VIP & Spa',
      'Produits Spa',
      'Parfums & gel hydroalcoolique',
      'Produits hygiène format voyage',
      'Flacons 500 ml',
      'Recharges 5 litres',
      'Portes flacons',
      'Flacons vides',
      'Autres',
    ];

    // ─── Section Promotions (portail partenaire) ────────────────────────────────
    const PromotionsSection = ({ catalogue, panier, setPanier, promoActive, promoTitle }) => {
      const promoProducts = useMemo(() => catalogue.filter(p => p.promo_pct > 0), [catalogue]);

      if (!promoActive || promoProducts.length === 0) return null;

      const getQty = (ref) => panier[ref]?.quantite || 0;

      const addCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const current = getQty(ref);
        setPanier(p => ({ ...p, [ref]: { ...prod, quantite: current + moq } }));
      };

      const removeCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const current = getQty(ref);
        const next = current - moq;
        if (next <= 0) {
          setPanier(p => { const n = { ...p }; delete n[ref]; return n; });
        } else {
          setPanier(p => ({ ...p, [ref]: { ...prod, quantite: next } }));
        }
      };

      return (
        <div className="mb-8">
          <div className="bg-gradient-to-r from-red-50 to-orange-50 dark:from-red-900/30 dark:to-orange-900/30 border border-red-200 dark:border-red-800 rounded-2xl p-4 sm:p-5">
            <div className="flex items-center gap-2 mb-4">
              <span className="text-lg">&#128293;</span>
              <h2 className="text-base sm:text-lg font-bold text-red-700 dark:text-red-400">{promoTitle || 'Promotions du moment'}</h2>
            </div>
            <div className="space-y-1">
              {promoProducts.map(p => {
                const moq = p.moq || 1;
                const qty = getQty(p.ref);
                const cartons = moq > 1 ? Math.floor(qty / moq) : qty;
                const inCart = qty > 0;
                return (
                  <div key={p.ref}
                    className={`flex items-center gap-2 px-3 py-2.5 rounded-lg transition-colors ${inCart ? 'bg-white/80 dark:bg-slate-700/80 border-l-2 border-l-red-400' : 'bg-white/50 dark:bg-slate-700/50 hover:bg-white/70 dark:hover:bg-slate-600/70'}`}
                  >
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="font-mono text-[10px] text-gray-400 dark:text-slate-500 shrink-0">{p.ref}</span>
                        <span className="text-xs sm:text-sm text-gray-900 dark:text-white truncate">{p.nom}</span>
                        <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500 text-white font-bold shrink-0">-{p.promo_pct}%</span>
                      </div>
                      <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                        <span className="text-xs text-gray-400 dark:text-slate-500 line-through">{p.prix_remise.toFixed(2)} &euro;</span>
                        <span className="text-xs font-bold text-red-600 dark:text-red-400">{p.prix_promo.toFixed(2)} &euro; HT/u</span>
                      </div>
                      {moq > 1 && (
                        <div className="text-[10px] text-gray-500 dark:text-slate-400 mt-0.5">Carton de {moq} &middot; {(p.prix_promo * moq).toFixed(2)} &euro; HT</div>
                      )}
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      {qty > 0 && (
                        <button onClick={() => removeCarton(p.ref)} className="w-9 h-9 rounded-lg bg-gray-100 dark:bg-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-500 flex items-center justify-center text-base font-bold transition-colors">-</button>
                      )}
                      {qty > 0 && (
                        <div className="text-center min-w-[32px]">
                          <div className="text-gray-900 dark:text-white font-semibold text-sm">{moq > 1 ? cartons : qty}</div>
                          {moq > 1 && <div className="text-[9px] text-gray-400 dark:text-slate-500 leading-none">{qty} u.</div>}
                        </div>
                      )}
                      <button onClick={() => addCarton(p.ref)} title={moq > 1 ? `Ajouter 1 carton (${moq} u. \u00b7 ${(p.prix_promo * moq).toFixed(2)} \u20ac HT)` : 'Ajouter 1 unit\u00e9'} className="w-9 h-9 rounded-lg bg-red-500 text-white hover:bg-red-600 flex items-center justify-center text-base font-bold transition-colors">+</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    const QUICK_ACCESS_CATS = [
      { label: 'R\u00e9assort 5L', match: 'Recharges 5 litres' },
      { label: 'Cadeaux VIP', match: 'Cadeaux VIP & Spa' },
      { label: 'Formats voyage', match: 'Produits hygi\u00e8ne format voyage' },
      { label: 'Parfums', match: 'Parfums & gel hydroalcoolique' },
    ];

    const CatalogueView = ({ catalogue, panier, setPanier }) => {
      const [search, setSearch] = useState("");
      const [openCats, setOpenCats] = useState({});
      const catRefs = useRef({});

      const filtered = useMemo(() => {
        if (!search) return catalogue;
        const q = normalizeText(search);
        return catalogue.filter(p => normalizeText(p.ref).includes(q) || normalizeText(p.nom).includes(q) || normalizeText(p.categorie || '').includes(q));
      }, [catalogue, search]);

      const grouped = useMemo(() => {
        const groups = {};
        for (const p of filtered) {
          const cat = p.categorie || 'Autres';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(p);
        }
        const ordered = [];
        for (const cat of CATEGORIES_ORDER) {
          if (groups[cat]) ordered.push({ categorie: cat, products: groups[cat] });
        }
        for (const cat of Object.keys(groups)) {
          if (!CATEGORIES_ORDER.includes(cat)) ordered.push({ categorie: cat, products: groups[cat] });
        }
        return ordered;
      }, [filtered]);

      useEffect(() => {
        if (search && search.length >= 2) {
          setOpenCats(prev => {
            const next = { ...prev };
            for (const g of grouped) next[g.categorie] = true;
            return next;
          });
        }
      }, [search, grouped]);

      const toggleCat = (cat) => setOpenCats(prev => ({ ...prev, [cat]: !prev[cat] }));

      const getQty = (ref) => panier[ref]?.quantite || 0;

      const addCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const current = getQty(ref);
        setPanier(p => ({ ...p, [ref]: { ...prod, quantite: current + moq } }));
      };

      const removeCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const current = getQty(ref);
        const next = current - moq;
        if (next <= 0) {
          setPanier(p => { const n = { ...p }; delete n[ref]; return n; });
        } else {
          setPanier(p => ({ ...p, [ref]: { ...prod, quantite: next } }));
        }
      };

      const panierCountByCat = useMemo(() => {
        const counts = {};
        for (const ref of Object.keys(panier)) {
          const prod = catalogue.find(c => c.ref === ref);
          if (prod) {
            const cat = prod.categorie || 'Autres';
            counts[cat] = (counts[cat] || 0) + 1;
          }
        }
        return counts;
      }, [panier, catalogue]);

      return (
        <div>
          {/* Barre de recherche */}
          <div className="mb-6">
            <div className="relative">
              <input
                type="text"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Rechercher un produit..."
                className="w-full bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-gold-500/50 focus:border-gold-500/40"
              />
              {search && (
                <button onClick={() => setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-slate-500 hover:text-gray-600 dark:hover:text-slate-300 text-lg px-1">&times;</button>
              )}
            </div>
          </div>

          {/* Raccourcis rapides */}
          {!search && (
            <div className="flex flex-wrap gap-2 mb-4">
              {QUICK_ACCESS_CATS.filter(c => grouped.some(g => g.categorie === c.match)).map(c => (
                <button key={c.match} onClick={() => {
                  setOpenCats(prev => ({ ...prev, [c.match]: true }));
                  setTimeout(() => catRefs.current[c.match]?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
                }}
                  className="px-3 py-1.5 rounded-full text-xs font-medium bg-gold-50 dark:bg-gold-900/30 text-gold-700 dark:text-gold-400 border border-gold-200 dark:border-gold-800 hover:bg-gold-100 dark:hover:bg-gold-900/50 transition-colors">
                  {c.label}
                </button>
              ))}
            </div>
          )}

          {/* Cat\u00e9gories */}
          {grouped.map(({ categorie, products }) => {
            const isOpen = !!openCats[categorie];
            const catPanierCount = panierCountByCat[categorie] || 0;
            return (
              <div key={categorie} ref={el => catRefs.current[categorie] = el} className="mb-3">
                <button
                  onClick={() => toggleCat(categorie)}
                  className="w-full flex items-center gap-2 px-3 py-3 rounded-xl bg-gray-50 dark:bg-slate-700 hover:bg-gray-100 dark:hover:bg-slate-600 transition-colors"
                >
                  <span className={`text-gray-400 dark:text-slate-500 text-xs transition-transform ${isOpen ? 'rotate-90' : ''}`} style={{display:'inline-block'}}>&#9654;</span>
                  <span className="text-sm font-semibold text-gray-900 dark:text-white flex-1 text-left">{categorie}</span>
                  <span className="text-xs text-gray-400 dark:text-slate-500">{products.length}</span>
                  {catPanierCount > 0 && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium">{catPanierCount} au panier</span>
                  )}
                </button>

                {isOpen && (
                  <div className="mt-1 space-y-0.5">
                    {products.map(p => {
                      const moq = p.moq || 1;
                      const qty = getQty(p.ref);
                      const cartons = moq > 1 ? Math.floor(qty / moq) : qty;
                      const inCart = qty > 0;
                      return (
                        <div
                          key={p.ref}
                          className={`flex items-center gap-2 px-3 py-2.5 rounded-lg transition-colors ${inCart ? 'bg-gold-50 dark:bg-gold-900/30 border-l-2 border-l-gold-500' : 'hover:bg-gray-50 dark:hover:bg-slate-700'}`}
                        >
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-[10px] text-gray-400 dark:text-slate-500 shrink-0">{p.ref}</span>
                              <span className="text-xs sm:text-sm text-gray-900 dark:text-white truncate">{p.nom}</span>
                            </div>
                            <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                              {p.promo_pct > 0 ? (
                                <>
                                  <span className="text-xs text-gray-400 dark:text-slate-500 line-through">{p.prix_remise.toFixed(2)} &euro;</span>
                                  <span className="text-xs font-bold text-red-600 dark:text-red-400">{p.prix_promo.toFixed(2)} &euro; HT/u</span>
                                  <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500 text-white font-bold">PROMO -{p.promo_pct}%</span>
                                </>
                              ) : (
                                <>
                                  <span className="text-xs font-semibold text-gold-600">{p.prix_remise.toFixed(2)} &euro; HT/u</span>
                                  {p.discount_pct > 0 && (
                                    <span className="text-[10px] px-1 py-0.5 rounded bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium">-{p.discount_pct}%</span>
                                  )}
                                </>
                              )}
                            </div>
                            {moq > 1 && (
                              <div className="text-[10px] text-gray-500 dark:text-slate-400 mt-0.5">Carton de {moq} &middot; {((p.prix_promo ?? p.prix_remise) * moq).toFixed(2)} &euro; HT</div>
                            )}
                          </div>
                          <div className="flex items-center gap-1 shrink-0">
                            {qty > 0 && (
                              <button onClick={() => removeCarton(p.ref)} className="w-9 h-9 rounded-lg bg-gray-100 dark:bg-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-500 flex items-center justify-center text-base font-bold transition-colors">-</button>
                            )}
                            {qty > 0 && (
                              <div className="text-center min-w-[32px]">
                                <div className="text-gray-900 dark:text-white font-semibold text-sm">{moq > 1 ? cartons : qty}</div>
                                {moq > 1 && <div className="text-[9px] text-gray-400 dark:text-slate-500 leading-none">{qty} u.</div>}
                              </div>
                            )}
                            <button onClick={() => addCarton(p.ref)} title={moq > 1 ? `Ajouter 1 carton (${moq} u. \u00b7 ${((p.prix_promo ?? p.prix_remise) * moq).toFixed(2)} \u20ac HT)` : 'Ajouter 1 unit\u00e9'} className="w-9 h-9 rounded-lg bg-gold-500 text-white hover:bg-gold-600 flex items-center justify-center text-base font-bold transition-colors">+</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
          {filtered.length === 0 && (
            <div className="text-center py-12 text-gray-400 dark:text-slate-500 text-sm">Aucun produit trouv&eacute;</div>
          )}
        </div>
      );
    };

    // ─── Panier Panel ───────────────────────────────────────────────────────────
    const PanierPanel = ({ panier, setPanier, onCommander, loading, partner, modifyingOrderId, initialNotes }) => {
      const [notes, setNotes] = useState(initialNotes || "");
      const [showConfirm, setShowConfirm] = useState(false);
      const confirmRef = useRef(null);
      const items = Object.values(panier);
      const subtotalHT = items.reduce((s, i) => s + (i.prix_promo ?? i.prix_remise) * i.quantite, 0);
      const francoSeuil = partner.franco_seuil ?? 800;
      const exonere = partner.frais_exonere ?? 0;
      const fpPrix = partner.fp_prix ?? 0;
      const fePrix = partner.fe_prix ?? 0;

      let fraisLabel = '';
      let fraisMontant = 0;
      let francoAtteint = subtotalHT >= francoSeuil;
      if (!exonere) {
        if (francoAtteint) {
          fraisLabel = 'Frais de pr\u00e9paration (FP)';
          fraisMontant = fpPrix;
        } else {
          fraisLabel = "Frais d'exp\u00e9dition (FE)";
          fraisMontant = fePrix;
        }
      }
      const totalHT = subtotalHT + fraisMontant;
      const tvaParProduit = items.reduce((s, i) => s + (i.prix_promo ?? i.prix_remise) * i.quantite * ((i.tva || 20) / 100), 0);
      const tvaSurFrais = fraisMontant * 0.2;
      const totalTTC = totalHT + tvaParProduit + tvaSurFrais;
      const manquePourFranco = Math.max(0, francoSeuil - subtotalHT);

      if (items.length === 0) {
        return (
          <div className="space-y-4">
            <div className="text-center py-8 text-gray-400 dark:text-slate-500 text-sm">
              Votre panier est vide.<br />Ajoutez des produits depuis le catalogue.
            </div>
            <div className="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 rounded-xl p-3 text-xs text-amber-800 dark:text-amber-300 space-y-1">
              <div className="font-semibold text-amber-900 dark:text-amber-400 mb-1">Conditions :</div>
              <ul className="list-disc list-inside space-y-0.5">
                <li>Franco port {francoSeuil.toFixed(0)} &euro; HT en France et 1&nbsp;500 &euro; HT &agrave; l'&eacute;tranger</li>
                <li>Sous le franco : frais d'exp&eacute;dition {fePrix > 0 ? fePrix.toFixed(0) : '80'} &euro; HT (FP inclus)</li>
                <li>Au-dessus du franco : frais de pr&eacute;paration r&eacute;duits &agrave; {fpPrix > 0 ? fpPrix.toFixed(0) : '25'} &euro; HT</li>
                <li>Conditionnement : bidons par cartons de 4, flacons par cartons de 6.</li>
              </ul>
            </div>
          </div>
        );

        <div className="space-y-4">
          {items.map(i => {
            const moq = i.moq || 1;
            const cartons = moq > 1 ? Math.floor(i.quantite / moq) : i.quantite;

              <div key={i.ref} className="bg-gray-50 dark:bg-slate-700 rounded-xl p-3">
                <div className="flex items-center justify-between">
                  <div className="min-w-0 flex-1">
                    <div className="text-xs text-gray-400 dark:text-slate-500 font-mono">{i.ref}</div>
                    <div className="text-sm text-gray-900 dark:text-white truncate">{i.nom}</div>
                    <div className="flex items-center gap-2 mt-0.5">
                      {i.promo_pct > 0 ? (
                        <>
                          <span className="text-xs text-gray-400 dark:text-slate-500 line-through">{i.prix_remise.toFixed(2)} &euro;</span>
                          <span className="text-xs font-bold text-red-600 dark:text-red-400">{i.prix_promo.toFixed(2)} &euro; HT/u</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500 text-white font-bold">-{i.promo_pct}%</span>
                        </>
                      ) : i.discount_pct > 0 ? (
                        <>
                          <span className="text-xs text-gray-400 dark:text-slate-500 line-through">{i.prix_ht.toFixed(2)} &euro;</span>
                          <span className="text-xs text-gold-600">{i.prix_remise.toFixed(2)} &euro; HT/u</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium">-{i.discount_pct}%</span>
                        </>
                      ) : (
                        <span className="text-xs text-gray-500 dark:text-slate-400">{i.prix_remise.toFixed(2)} &euro; HT/u</span>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-3 ml-3">
                    <div className="flex items-center gap-1">
                      <button onClick={() => setPanier(p => {
                        const next = i.quantite - moq;
                        if (next <= 0) { const n = { ...p }; delete n[i.ref]; return n; }
                        return { ...p, [i.ref]: { ...i, quantite: next } };
                      })} className="w-8 h-8 rounded-lg bg-gray-200 dark:bg-slate-600 text-gray-600 dark:text-slate-300 text-sm hover:bg-gray-300 dark:hover:bg-slate-500 flex items-center justify-center">-</button>
                      <div className="text-center min-w-[32px]">
                        <div className="text-gray-900 dark:text-white text-sm font-semibold">{moq > 1 ? cartons : i.quantite}</div>
                        {moq > 1 && <div className="text-[9px] text-gray-400 dark:text-slate-500 leading-none">{i.quantite} u.</div>}
                      </div>
                      <button onClick={() => setPanier(p => ({ ...p, [i.ref]: { ...i, quantite: i.quantite + moq } }))} className="w-8 h-8 rounded-lg bg-gray-200 dark:bg-slate-600 text-gray-600 dark:text-slate-300 text-sm hover:bg-gray-300 dark:hover:bg-slate-500 flex items-center justify-center">+</button>
                    </div>
                    <div className="text-sm text-gray-900 dark:text-white font-medium w-20 text-right">{((i.prix_promo ?? i.prix_remise) * i.quantite).toFixed(2)} &euro;</div>
                  </div>
                </div>
              </div>
            );
          })}

          {/* Barre de progression franco */}
          {!exonere && (
            <div className="bg-gray-50 dark:bg-slate-700 rounded-xl p-3">
              <div className="flex justify-between text-[11px] mb-1.5">
                <span className={francoAtteint ? "text-gold-600 font-medium" : "text-gray-500 dark:text-slate-400"}>
                  {francoAtteint ? `Franco atteint \u2014 frais r\u00e9duits \u00e0 ${fpPrix.toFixed(0)} \u20ac HT` : `Encore ${manquePourFranco.toFixed(2)} \u20ac pour le franco`}
                </span>
                <span className="text-gray-400 dark:text-slate-500">{subtotalHT.toFixed(0)} / {francoSeuil.toFixed(0)} &euro; HT</span>
              </div>
              <div className="w-full bg-gray-200 dark:bg-slate-600 rounded-full h-1.5">
                <div
                  className={`h-1.5 rounded-full transition-all ${francoAtteint ? 'bg-gold-500' : 'bg-amber-500'}`}
                  style={{ width: `${Math.min(100, (subtotalHT / francoSeuil) * 100)}%` }}
                />
              </div>
              <div className="text-[10px] mt-1 text-gray-400 dark:text-slate-500">
                Sous {francoSeuil.toFixed(0)} &euro; : exp&eacute;dition {fePrix.toFixed(0)} &euro; HT &middot; Au-dessus : r&eacute;duits &agrave; {fpPrix.toFixed(0)} &euro; HT
              </div>
            </div>

              <span>{subtotalHT.toFixed(2)} &euro;</span>

              <div className={`flex justify-between text-sm ${francoAtteint ? 'text-gold-600' : 'text-amber-600'}`}>

                <span>{fraisMontant.toFixed(2)} &euro;</span>

            {exonere === 1 && (
              <div className="flex justify-between text-sm text-green-600">
                <span>Frais</span>
                <span>Exon&eacute;r&eacute;</span>

              <span>Total HT</span>
              <span>{totalHT.toFixed(2)} &euro;</span>
            </div>
            <div className="flex justify-between text-sm text-gray-400 dark:text-slate-500">
              <span>Total TTC</span>
              <span>{totalTTC.toFixed(2)} &euro;</span>
            </div>
          </div>
          <div className="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 rounded-xl p-3 text-xs text-amber-800 dark:text-amber-300 space-y-1">
            <div className="font-semibold text-amber-900 dark:text-amber-400 mb-1">Conditions :</div>
            <ul className="list-disc list-inside space-y-0.5">
              <li>Franco port {francoSeuil.toFixed(0)} &euro; HT en France et 1&nbsp;500 &euro; HT &agrave; l'&eacute;tranger</li>
              <li>Sous le franco : frais d'exp&eacute;dition {fePrix > 0 ? fePrix.toFixed(0) : '80'} &euro; HT (FP inclus)</li>
              <li>Au-dessus du franco : frais de pr&eacute;paration r&eacute;duits &agrave; {fpPrix > 0 ? fpPrix.toFixed(0) : '25'} &euro; HT</li>
              <li>Conditionnement : bidons par cartons de 4, flacons par cartons de 6.</li>
            </ul>
          </div>
          <textarea
            value={notes}
            onChange={e => setNotes(e.target.value)}
            placeholder="Notes ou instructions (optionnel)..."
            className="w-full bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-gold-500/50 resize-none"
            rows={3}
          />

          {/* Ecran de confirmation (point 6) */}
          {showConfirm ? (
            <div ref={confirmRef} className="bg-gold-50 dark:bg-gold-900/30 border border-gold-200 dark:border-gold-800 rounded-xl p-4 space-y-3 animate-fade-in">
              <div className="text-sm font-semibold text-gray-900 dark:text-white">R&eacute;capitulatif de votre commande</div>
              <div className="space-y-1 max-h-40 overflow-y-auto">
                {items.map(i => (
                  <div key={i.ref} className="flex justify-between text-xs text-gray-700 dark:text-slate-200">
                    <span>{i.quantite}x {i.nom}</span>
                    <span>{((i.prix_promo ?? i.prix_remise) * i.quantite).toFixed(2)} &euro;</span>
                  </div>
                ))}
              </div>
              <div className="border-t border-gold-200 dark:border-gold-800 pt-2 space-y-1">
                {!exonere && fraisMontant > 0 && (
                  <div className="flex justify-between text-xs text-gray-500 dark:text-slate-400">
                    <span>{fraisLabel}</span>
                    <span>{fraisMontant.toFixed(2)} &euro;</span>
                  </div>
                )}
                <div className="flex justify-between text-sm font-semibold text-gray-900 dark:text-white">
                  <span>Total HT</span>
                  <span>{totalHT.toFixed(2)} &euro;</span>
                </div>
                <div className="flex justify-between text-xs text-gray-400 dark:text-slate-500">
                  <span>Total TTC</span>
                  <span>{totalTTC.toFixed(2)} &euro;</span>
                </div>
              </div>
              {notes && <div className="text-xs text-gray-500 dark:text-slate-400 italic">Note : "{notes}"</div>}
              <div className="flex gap-2">
                <button
                  onClick={() => setShowConfirm(false)}
                  className="flex-1 py-2.5 rounded-xl text-sm font-medium border border-gray-200 dark:border-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors"
                >
                  Modifier
                </button>
                <button
                  onClick={() => { setShowConfirm(false); onCommander(notes); }}
                  disabled={loading}
                  className="flex-1 bg-gold-500 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-gold-600 transition-colors disabled:opacity-50"
                >
                  {loading ? "Envoi..." : "Confirmer"}
                </button>
              </div>
            </div>
          ) : (
            <button
              onClick={() => { setShowConfirm(true); setTimeout(() => confirmRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); }}
              disabled={loading}
              className="w-full bg-gold-500 text-white py-3 rounded-xl text-sm font-semibold hover:bg-gold-600 transition-colors disabled:opacity-50"
            >
              {loading ? "Envoi en cours..." : modifyingOrderId ? `Enregistrer les modifications (${totalHT.toFixed(2)} \u20ac HT)` : `Commander (${totalHT.toFixed(2)} \u20ac HT)`}
            </button>
          )}
        </div>
      );
    };

    // ─── Historique ─────────────────────────────────────────────────────────────
    const HistoriqueView = ({ commandes, onRefresh, catalogue, setPanier, setPanierOpen, setVue, setModifyingOrderId, setModifyingNotes, showToast, partner, isMaster }) => {
      const [cancelling, setCancelling] = useState(null);
      const [filtre, setFiltre] = useState('tous');
      const [expandedId, setExpandedId] = useState(null);
      const [pageSize] = useState(20);
      const [visibleCount, setVisibleCount] = useState(20);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const toggleSelect = (id) => setSelectedIds(prev => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });
      const statutConfig = {
        en_attente: { label: "En attente", bg: "bg-amber-50 dark:bg-amber-900/30", text: "text-amber-700 dark:text-amber-300" },
        validee: { label: "Valid\u00e9e", bg: "bg-green-50 dark:bg-green-900/30", text: "text-green-700 dark:text-green-400" },
        annulee: { label: "Annul\u00e9e", bg: "bg-red-50 dark:bg-red-900/30", text: "text-red-700 dark:text-red-400" },
        annulee_client: { label: "Annul\u00e9e", bg: "bg-red-50 dark:bg-red-900/30", text: "text-red-700 dark:text-red-400" },
      };

      const handleCancel = async (id) => {
        if (!confirm('Annuler cette commande ?')) return;
        setCancelling(id);
        try {
          const res = await api.del(`/commande/${id}`);
          if (res.erreur) { showToast(res.erreur, 'error'); }
          else { showToast('Commande annul\u00e9e', 'success'); onRefresh(); }
        } catch (e) { showToast('Erreur annulation', 'error'); }
        setCancelling(null);
      };

      const handleModify = (c) => {
        const newPanier = {};
        c.products.forEach(p => {
          const prod = catalogue.find(cat => cat.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          } else {
            newPanier[p.ref] = { ref: p.ref, nom: p.nom, prix_ht: p.prix_ht, prix_remise: p.prix_remise, discount_pct: p.discount_pct || 0, moq: 1, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setModifyingOrderId(c.id);
        setModifyingNotes(c.notes || "");
        setPanierOpen(true);
        setVue('catalogue');
        showToast('Commande charg\u00e9e dans le panier \u2014 validez pour enregistrer les modifications', 'info');
      };

      const handleReorder = (c) => {
        const newPanier = {};
        c.products.forEach(p => {
          const prod = catalogue.find(cat => cat.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          } else {
            newPanier[p.ref] = { ref: p.ref, nom: p.nom, prix_ht: p.prix_ht, prix_remise: p.prix_remise, discount_pct: p.discount_pct || 0, tva: p.tva || 20, moq: 1, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setPanierOpen(true);
        setVue('catalogue');
        showToast('Panier rempli \u2014 vous pouvez ajuster avant de commander', 'success');
      };

      const exportCsv = () => {
        const toExport = selectedIds.size > 0 ? commandes.filter(c => selectedIds.has(c.id)) : commandes;
        if (toExport.length === 0) { showToast('Aucune commande \u00e0 exporter', 'error'); return; }
        const header = isMaster
          ? ['Date', '\u00c9tablissement', 'Statut', 'Facture', 'R\u00e9f\u00e9rence', 'Produit', 'Quantit\u00e9', 'Prix unitaire HT', 'Total ligne HT', 'Total commande HT', 'Total commande TTC', 'Notes']
          : ['Date', 'Statut', 'Facture', 'R\u00e9f\u00e9rence', 'Produit', 'Quantit\u00e9', 'Prix unitaire HT', 'Total ligne HT', 'Total commande HT', 'Total commande TTC', 'Notes'];
        const rows = [header];
        for (const c of toExport) {
          const cfg = statutConfig[c.statut] || {};
          const date = new Date(c.created_at).toLocaleDateString('fr-FR');
          for (const p of c.products) {
            const row = [
              date,
              ...(isMaster ? [(c.etablissement_nom || '').replace(/"/g, '""')] : []),
              cfg.label || c.statut,
              c.vf_invoice_number || '',
              p.ref,
              (p.nom || '').replace(/"/g, '""'),
              p.quantite,
              p.prix_remise.toFixed(2),
              p.total_ht.toFixed(2),
              c.total_ht.toFixed(2),
              c.total_ttc.toFixed(2),
              (c.notes || '').replace(/"/g, '""'),
            ];
            rows.push(row);
          }
        }
        const csv = rows.map(r => r.map(v => `"${v}"`).join(';')).join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `commandes-${partner.nom || 'export'}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`${toExport.length} commande${toExport.length > 1 ? 's' : ''} export\u00e9e${toExport.length > 1 ? 's' : ''}`, 'success');
        setSelectedIds(new Set());
      };

      const filtreOptions = [
        { key: 'tous', label: 'Toutes' },
        { key: 'en_attente', label: 'En attente' },
        { key: 'validee', label: 'Valid\u00e9es' },
        { key: 'annulee', label: 'Annul\u00e9es' },
      ];

      const filtered = filtre === 'tous'
        ? commandes
        : commandes.filter(c => filtre === 'annulee' ? (c.statut === 'annulee' || c.statut === 'annulee_client') : c.statut === filtre);

      const handleDownloadPdf = async (c) => {
        try {
          const res = await fetch(`${API_BASE}/commande/${c.id}/pdf`, { headers: window.partnerApi._headers() });
          if (!res.ok) { showToast('Facture non disponible', 'error'); return; }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `facture-${c.vf_invoice_number || c.id}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {
          showToast('Erreur t\u00e9l\u00e9chargement facture', 'error');
        }
      };

      if (commandes.length === 0) {
        return <div className="text-center py-12 text-gray-400 dark:text-slate-500 text-sm">Aucune commande pass&eacute;e.</div>;
      }

      return (
        <div className="space-y-4">
          {/* Filtres par statut */}
          <div className="flex gap-1 bg-gray-100 dark:bg-slate-600 rounded-xl p-1">
            {filtreOptions.map(f => {
              const count = f.key === 'tous' ? commandes.length
                : f.key === 'annulee' ? commandes.filter(c => c.statut === 'annulee' || c.statut === 'annulee_client').length
                : commandes.filter(c => c.statut === f.key).length;
              return (
                <button key={f.key} onClick={() => setFiltre(f.key)}
                  className={`flex-1 px-3 py-2 rounded-lg text-xs font-medium transition-colors ${filtre === f.key ? 'bg-white dark:bg-slate-800 shadow-sm dark:shadow-none text-gray-900 dark:text-white' : 'text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200'}`}>
                  {f.label} <span className="text-gray-400 dark:text-slate-500 ml-0.5">({count})</span>
                </button>
              );
            })}
          </div>

          {/* Barre d'actions export */}
          <div className="flex items-center justify-between">
            <div className="text-xs text-gray-400 dark:text-slate-500">
              {selectedIds.size > 0 && `${selectedIds.size} s\u00e9lectionn\u00e9e${selectedIds.size > 1 ? 's' : ''}`}
            </div>
            <div className="flex items-center gap-2">
              {selectedIds.size > 0 && (
                <button onClick={() => setSelectedIds(new Set())} className="text-xs text-gray-400 dark:text-slate-500 hover:text-gray-600 dark:hover:text-slate-300 transition-colors">
                  D&eacute;s&eacute;lectionner
                </button>
              )}
              <button onClick={exportCsv}
                className="text-xs px-3 py-2 rounded-lg border border-gray-200 dark:border-slate-600 text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors flex items-center gap-1">
                &#128196; Exporter {selectedIds.size > 0 ? `(${selectedIds.size})` : 'tout'} en CSV
              </button>
            </div>
          </div>

          {filtered.length === 0 && (
            <div className="text-center py-8 text-gray-400 dark:text-slate-500 text-sm">Aucune commande dans cette cat&eacute;gorie.</div>
          )}

          {filtered.slice(0, visibleCount).map(c => {
            const cfg = statutConfig[c.statut] || statutConfig.en_attente;
            const isExpanded = expandedId === c.id;
            const isSelected = selectedIds.has(c.id);
            return (
              <div key={c.id} className={`bg-white dark:bg-slate-800 border rounded-2xl shadow-sm dark:shadow-none overflow-hidden transition-colors ${isSelected ? 'border-gold-400 dark:border-gold-700 ring-1 ring-gold-200 dark:ring-gold-800' : 'border-gray-200 dark:border-slate-600'}`}>
                {/* En-tête cliquable */}
                <div className="flex items-center">
                  <label className="flex items-center justify-center w-10 shrink-0 cursor-pointer" onClick={e => e.stopPropagation()}>
                    <input type="checkbox" checked={isSelected} onChange={() => toggleSelect(c.id)}
                      className="w-4 h-4 rounded border-gray-300 dark:border-slate-600 text-gold-500 focus:ring-gold-500/30 cursor-pointer" />
                  </label>
                <button onClick={() => setExpandedId(isExpanded ? null : c.id)} className="flex-1 flex items-center justify-between p-4 pl-0 text-left hover:bg-gray-50/50 dark:hover:bg-slate-700/50 transition-colors">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <span className="text-xs text-gray-500 dark:text-slate-400">{new Date(c.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                      {isMaster && c.etablissement_nom && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400">{c.etablissement_nom}</span>}
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-medium ${cfg.bg} ${cfg.text}`}>{cfg.label}</span>
                      {c.statut === 'validee' && c.delivered_at && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400">Livr&eacute;e</span>}
                      {c.statut === 'validee' && c.tracking_number && !c.delivered_at && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400">Exp&eacute;di&eacute;e</span>}
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-semibold text-gray-900 dark:text-white">{c.total_ht.toFixed(2)} &euro; HT</span>
                      <span className="text-xs text-gray-400 dark:text-slate-500">{c.products.length} produit{c.products.length > 1 ? 's' : ''}</span>
                      {c.vf_invoice_number && <span className="text-[10px] px-1.5 py-0.5 rounded bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-400 font-medium">Facture n&deg;{c.vf_invoice_number}</span>}
                    </div>
                  </div>
                  <span className={`text-gray-400 dark:text-slate-500 text-xs transition-transform ${isExpanded ? 'rotate-180' : ''}`}>&#9660;</span>
                </button>
                </div>

                {/* Détail déplié */}
                {isExpanded && (
                  <div className="px-5 pb-5 border-t border-gray-100 dark:border-slate-700 animate-fade-in">
                    <div className="space-y-1.5 py-3">
                      {c.products.map((p, i) => (
                        <div key={i} className="flex items-center justify-between text-sm">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="font-mono text-[10px] text-gray-400 dark:text-slate-500 shrink-0">{p.ref}</span>
                            <span className="text-gray-700 dark:text-slate-200 truncate">{p.nom}</span>
                            {p.promo_pct > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500 text-white font-bold shrink-0">PROMO -{p.promo_pct}%</span>}
                            {p.discount_pct > 0 && !p.promo_pct && <span className="text-[10px] px-1 py-0.5 rounded bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-400 font-medium shrink-0">-{p.discount_pct}%</span>}
                          </div>
                          <div className="flex items-center gap-3 shrink-0 ml-2">
                            <span className="text-xs text-gray-400 dark:text-slate-500">{p.quantite} u. &times; {p.prix_remise.toFixed(2)} &euro;</span>
                            <span className="text-gray-900 dark:text-white font-medium w-20 text-right">{p.total_ht.toFixed(2)} &euro;</span>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="border-t border-gray-100 dark:border-slate-700 pt-2 space-y-1">
                      {c.frais_montant > 0 && (
                        <div className="flex justify-between text-xs text-gray-500 dark:text-slate-400">
                          <span>{c.frais_ref === 'FP' ? 'Frais de pr\u00e9paration' : "Frais d'exp\u00e9dition"}</span>
                          <span>{c.frais_montant.toFixed(2)} &euro;</span>
                        </div>
                      )}
                      <div className="flex justify-between text-sm font-semibold text-gray-900 dark:text-white">
                        <span>Total HT</span>
                        <span>{c.total_ht.toFixed(2)} &euro;</span>
                      </div>
                      <div className="flex justify-between text-xs text-gray-400 dark:text-slate-500">
                        <span>Total TTC</span>
                        <span>{c.total_ttc.toFixed(2)} &euro;</span>
                      </div>
                    </div>
                    {c.notes && <div className="text-xs text-gray-400 dark:text-slate-500 mt-3 italic border-t border-gray-50 dark:border-slate-700 pt-2">Note : "{c.notes}"</div>}

                    {/* Suivi exp&eacute;dition — uniquement si tracking renseign&eacute; */}
                    {c.statut === 'validee' && (c.tracking_number || c.delivered_at) && (
                      <div className="mt-3 pt-3 border-t border-gray-100 dark:border-slate-700">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="text-xs font-semibold text-gray-700 dark:text-slate-200">Suivi exp&eacute;dition</span>
                        </div>
                        {c.delivered_at ? (
                          <div className="flex items-center gap-2 text-sm text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 rounded-xl px-3 py-2">
                            <span>&#9989;</span>
                            <span>Livr&eacute;e le {new Date(c.delivered_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                          </div>
                        ) : (
                          <div className="flex items-center gap-2 text-sm text-blue-700 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 rounded-xl px-3 py-2">
                            <span>&#128230;</span>
                            <span>Exp&eacute;di&eacute;e{c.shipped_at ? ` le ${new Date(c.shipped_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}` : ''}</span>
                            {c.tracking_url && (
                              <a href={c.tracking_url} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                                className="ml-auto text-xs px-2 py-1 bg-blue-100 dark:bg-blue-900/40 hover:bg-blue-200 dark:hover:bg-blue-900/50 text-blue-800 dark:text-blue-300 rounded-lg transition-colors font-medium">
                                Suivre mon colis
                              </a>
                            )}
                          </div>
                        )}
                      </div>
                    )}

                    <div className="flex flex-wrap gap-2 mt-3 pt-2 border-t border-gray-100 dark:border-slate-700">
                      {c.statut === 'en_attente' && (
                        <>
                          <button onClick={() => handleModify(c)} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-gold-50 dark:bg-gold-900/30 text-gold-700 dark:text-gold-400 hover:bg-gold-100 dark:hover:bg-gold-900/50 transition-colors">
                            Modifier
                          </button>
                          <button onClick={() => handleCancel(c.id)} disabled={cancelling === c.id} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors disabled:opacity-50">
                            {cancelling === c.id ? 'Annulation...' : 'Annuler'}
                          </button>
                        </>
                      )}
                      <button onClick={() => handleReorder(c)} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors">
                        Commander de nouveau
                      </button>
                      {c.vf_invoice_number && (
                        <button onClick={() => handleDownloadPdf(c)} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-400 hover:bg-green-100 dark:hover:bg-green-900/40 transition-colors flex items-center gap-1">
                          &#128196; Facture
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}

          {/* Pagination */}
          {filtered.length > visibleCount && (
            <div className="text-center py-3">
              <button onClick={() => setVisibleCount(v => v + pageSize)}
                className="text-xs px-6 py-2.5 rounded-xl border border-gray-200 dark:border-slate-600 hover:bg-gray-50 dark:hover:bg-slate-700 text-gray-600 dark:text-slate-300 transition-colors">
                Charger plus ({filtered.length - visibleCount} restante{filtered.length - visibleCount > 1 ? 's' : ''})
              </button>
            </div>
          )}

        </div>
      );
    };

    // ─── Profil ──────────────────────────────────────────────────────────────────
    const ProfilView = ({ partner, setPartner, commandes, showToast }) => {
      // Pré-remplir les champs livraison depuis facturation si vides
      const nameParts = (partner.contact_nom || '').trim().split(/\s+/);
      const defaultPrenom = nameParts.length > 1 ? nameParts.slice(0, -1).join(' ') : nameParts[0] || '';
      const defaultNom = nameParts.length > 1 ? nameParts[nameParts.length - 1] : '';
      // Fallback : si les champs structurés sont tous vides, parser l'ancien champ adresse concaténé
      let fbRue = '', fbCp = '', fbVille = '';
      if (!partner.facturation_rue && !partner.facturation_code_postal && !partner.facturation_ville && partner.adresse) {
        const parts = partner.adresse.split(',').map(s => s.trim());
        if (parts.length >= 3) { fbRue = parts[0]; fbCp = parts[1]; fbVille = parts[2]; }
        else if (parts.length === 2) { fbRue = parts[0]; fbVille = parts[1]; }
        else { fbRue = parts[0]; }
      }
      const fRue = partner.facturation_rue || fbRue;
      const fCp = partner.facturation_code_postal || fbCp;
      const fVille = partner.facturation_ville || fbVille;

    const DocumentsView = () => {
      const [docs, setDocs] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        api.get('/documents').then(data => {
          if (Array.isArray(data)) setDocs(data);
        }).catch(e => console.error(e)).finally(() => setLoading(false));
      }, []);

      if (loading) return (
        <div className="flex justify-center py-12">
          <div className="w-6 h-6 border-2 border-gold-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
      );

      if (docs.length === 0) return (
        <div className="text-center py-12">
          <div className="text-4xl mb-3">&#128196;</div>
          <p className="text-gray-500 dark:text-slate-400 text-sm">Aucun document disponible pour le moment.</p>
        </div>
      );

      const getFileFormat = (url) => {
        try {
          const path = new URL(url, window.location.origin).pathname;
          const ext = path.split('.').pop().toLowerCase();
          const formats = { pdf: 'PDF', doc: 'Word', docx: 'Word', pages: 'Pages', xls: 'Excel', xlsx: 'Excel', ppt: 'PowerPoint', pptx: 'PowerPoint', jpg: 'Image', jpeg: 'Image', png: 'Image', gif: 'Image', zip: 'ZIP', csv: 'CSV', txt: 'Texte' };
          return formats[ext] || null;
        } catch { return null; }
      };
      const getFormatIcon = (format) => {
        const icons = { PDF: '\uD83D\uDCD5', Word: '\uD83D\uDCD8', Pages: '\uD83D\uDCD3', Excel: '\uD83D\uDCCA', PowerPoint: '\uD83D\uDCCA', Image: '\uD83D\uDDBC\uFE0F', ZIP: '\uD83D\uDCE6', CSV: '\uD83D\uDCCB', Texte: '\uD83D\uDCC4' };
        return icons[format] || '\uD83D\uDCC4';
      };

      return (
        <div className="space-y-3">
          {docs.map(doc => {
            const format = getFileFormat(doc.url);
            const icon = getFormatIcon(format);
            return (
              <a key={doc.id} href={doc.url} target="_blank" rel="noopener noreferrer"
                className="block bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-2xl p-5 shadow-sm dark:shadow-none hover:shadow-md dark:hover:shadow-none hover:border-gold-300 transition-all group">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gold-50 dark:bg-gold-900/30 flex items-center justify-center text-gold-600 text-lg shrink-0 group-hover:bg-gold-100 dark:group-hover:bg-gold-900/50 transition-colors">
                    {icon}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-semibold text-gray-900 dark:text-white group-hover:text-gold-700 dark:group-hover:text-gold-400 transition-colors">{doc.titre}</span>
                      {format && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-600 text-gray-500 dark:text-slate-400 font-medium shrink-0">{format}</span>}
                    </div>
                    {doc.description && <div className="text-xs text-gray-400 dark:text-slate-500 mt-0.5 truncate">{doc.description}</div>}
                  </div>
                  <div className="text-gray-300 dark:text-slate-500 group-hover:text-gold-500 transition-colors shrink-0">
                    &#8599;
                  </div>
                </div>
              </a>
            );
          })}
        </div>
      );
    };
