<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Terre de Mars — Espace Partenaire</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23A28E3F'/><text x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='13' fill='white'>TM</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#F9F7F1',
              100: '#F1EDDD',
              200: '#E3DCC0',
              300: '#D1C79F',
              400: '#B9AA6F',
              500: '#A28E3F',
              600: '#877633',
              700: '#6C5E29',
              800: '#51461F',
              900: '#362F15',
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tache {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .tache-1 {
      top: -40px;
      right: -30px;
      width: 420px;
      height: 420px;
      background: radial-gradient(ellipse at 45% 45%, rgba(162,142,63,0.18) 0%, rgba(162,142,63,0.08) 35%, transparent 65%);
      border-radius: 42% 58% 55% 45% / 50% 42% 58% 50%;
      transform: rotate(-15deg);
    }
    .tache-2 {
      bottom: 5%;
      left: -40px;
      width: 360px;
      height: 360px;
      background: radial-gradient(ellipse at 55% 50%, rgba(162,142,63,0.14) 0%, rgba(162,142,63,0.06) 35%, transparent 65%);
      border-radius: 55% 45% 48% 52% / 45% 55% 45% 55%;
      transform: rotate(10deg);
    }
    .tache-3 {
      top: 40%;
      right: 5%;
      width: 300px;
      height: 300px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.10) 0%, rgba(162,142,63,0.04) 35%, transparent 60%);
      border-radius: 48% 52% 45% 55% / 52% 48% 52% 48%;
      transform: rotate(25deg);
    }
    .tache-login-1 {
      top: 10%;
      right: 5%;
      width: 45vw;
      height: 45vw;
      max-width: 550px;
      max-height: 550px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.20) 0%, rgba(162,142,63,0.10) 30%, rgba(162,142,63,0.03) 55%, transparent 70%);
      border-radius: 42% 58% 52% 48% / 48% 42% 58% 52%;
      transform: rotate(-10deg);
    }
    .tache-login-2 {
      bottom: 8%;
      left: 3%;
      width: 40vw;
      height: 40vw;
      max-width: 480px;
      max-height: 480px;
      background: radial-gradient(ellipse at 50% 50%, rgba(162,142,63,0.16) 0%, rgba(162,142,63,0.07) 35%, transparent 65%);
      border-radius: 55% 45% 48% 52% / 52% 55% 45% 48%;
      transform: rotate(20deg);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const API_BASE = window.location.origin + '/api/partenaire';

    window.partnerApi = {
      _headers: () => {
        const token = sessionStorage.getItem('partner_token') || '';
        return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
      },
      _handle: (r) => {
        if (r.status === 401) { sessionStorage.removeItem('partner_token'); window.location.reload(); throw new Error('Session expirée'); }
        return r.json();
      },
      get: (path) => fetch(API_BASE + path, { headers: window.partnerApi._headers() }).then(window.partnerApi._handle),
      post: (path, body) => fetch(API_BASE + path, { method: 'POST', headers: window.partnerApi._headers(), body: JSON.stringify(body) }).then(window.partnerApi._handle),
      patch: (path, body) => fetch(API_BASE + path, { method: 'PATCH', headers: window.partnerApi._headers(), body: JSON.stringify(body) }).then(window.partnerApi._handle),
      del: (path) => fetch(API_BASE + path, { method: 'DELETE', headers: window.partnerApi._headers() }).then(window.partnerApi._handle),
    };
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;
    const api = window.partnerApi;

    // ─── Toast ──────────────────────────────────────────────────────────────────
    const Toast = ({ toast }) => {
      if (!toast || !toast.visible) return null;
      const colors = { success: "bg-green-600", error: "bg-red-500", info: "bg-gray-800" };
      return (
        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-white text-sm font-medium animate-fade-in ${colors[toast.type] || colors.info}`}>
          {toast.type === "success" && "\u2713 "}{toast.type === "error" && "\u2717 "}{toast.message}
        </div>
      );
    };

    // ─── Login Screen ───────────────────────────────────────────────────────────
    const LoginScreen = ({ onLogin }) => {
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleLogin = async () => {
        if (!password.trim()) return;
        setLoading(true);
        setError("");
        try {
          const res = await api.post('/login', { password: password.trim() });
          if (res.erreur) {
            setError(res.erreur);
          } else if (res.token) {
            sessionStorage.setItem('partner_token', res.token);
            onLogin(res.partenaire);
          }
        } catch (e) {
          setError("Impossible de contacter le serveur");
        }
        setLoading(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
          <div className="tache tache-login-1"></div>
          <div className="tache tache-login-2"></div>
          <div className="relative z-10 w-full max-w-sm animate-fade-in text-center">
            <div className="mb-10">
              <img src="/logo-tdm-anim.gif" alt="Terre de Mars" className="h-24 mx-auto mb-6" />
            </div>
            <div className="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
              <h2 className="text-sm font-medium text-gray-700 mb-1">Espace Partenaire</h2>
              <p className="text-xs text-gray-400 mb-6">Entrez votre mot de passe pour acc&eacute;der au catalogue.</p>
              <input
                type="password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                placeholder="Mot de passe..."
                className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gold-500/50 focus:border-gold-500/40"
                autoFocus
              />
              {error && <p className="text-red-500 text-xs mt-2">{error}</p>}
              <button
                onClick={handleLogin}
                disabled={loading}
                className="w-full mt-4 bg-gold-500 text-white py-3 rounded-xl text-sm font-medium hover:bg-gold-600 transition-colors disabled:opacity-50"
              >
                {loading ? "Connexion..." : "Acc\u00e9der"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ─── Constantes amenities ─────────────────────────────────────────────────
    const AMENITY_TYPES = [
      { key: 'gel_douche', label: 'Gel douche', gammes: [
        { ref: 'P008', gamme: 'Verveine / Reddition' },
        { ref: 'P035', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'shampoing', label: 'Shampoing', gammes: [
        { ref: 'P019', gamme: 'Verveine / Reddition' },
        { ref: 'P010', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P034', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'gel_corps_cheveux', label: 'Gel Corps & Cheveux', gammes: [
        { ref: 'P042', gamme: 'Verveine / Reddition' },
        { ref: 'P014', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P040', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'apres_shampoing', label: 'Apr\u00e8s-shampoing', gammes: [
        { ref: 'P024', gamme: 'C\u00e9drat / Irr\u00e9v\u00e9rence' },
        { ref: 'P037', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
      ]},
      { key: 'lotion', label: 'Lotion Corps & Main', gammes: [
        { ref: 'P036', gamme: 'Th\u00e9 Blanc / \u00c9l\u00e9gance' },
        { ref: 'P011', gamme: 'V\u00e9tiver / Imminence' },
      ]},
      { key: 'savon_main', label: 'Savon Liquide Main', gammes: [
        { ref: 'P007', gamme: 'V\u00e9tiver / Insurrection' },
      ]},
    ];

    // ─── Section Amenities (produits en chambre) ──────────────────────────────
    const MAIN_SUFFIXES = ['', '-5000']; // 500ml (base ref) et 5L
    const isMainFormat = (ref, baseRef) => ref === baseRef || ref === baseRef + '-5000';

    const AmenityProductRow = ({ p, getQty, addCarton, removeCarton }) => {
      const moq = p.moq || 1;
      const qty = getQty(p.ref);
      const cartons = moq > 1 ? Math.floor(qty / moq) : qty;
      const inCart = qty > 0;
      return (
        <div className={`flex items-center gap-2 px-3 py-2.5 rounded-lg transition-colors ${inCart ? 'bg-gold-50 border-l-2 border-l-gold-500' : 'hover:bg-gray-50'}`}>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className="font-mono text-[10px] text-gray-400 shrink-0">{p.ref}</span>
              <span className="text-xs sm:text-sm text-gray-900 truncate">{p.nom}</span>
            </div>
            <div className="flex items-center gap-2 mt-0.5">
              <span className="text-xs font-semibold text-gold-600">{p.prix_remise.toFixed(2)} &euro; HT</span>
              {p.discount_pct > 0 && (
                <span className="text-[10px] px-1 py-0.5 rounded bg-gold-100 text-gold-700 font-medium">-{p.discount_pct}%</span>
              )}
              {moq > 1 && (
                <span className="text-[10px] text-gray-400">carton de {moq}</span>
              )}
            </div>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            {qty > 0 && (
              <button onClick={() => removeCarton(p.ref)} className="w-9 h-9 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center text-base font-bold transition-colors">-</button>
            )}
            {qty > 0 && (
              <div className="text-center min-w-[32px]">
                <div className="text-gray-900 font-semibold text-sm">{moq > 1 ? cartons : qty}</div>
                {moq > 1 && <div className="text-[9px] text-gray-400 leading-none">{qty} u.</div>}
              </div>
            )}
            <button onClick={() => addCarton(p.ref)} className="w-9 h-9 rounded-lg bg-gold-500 text-white hover:bg-gold-600 flex items-center justify-center text-base font-bold transition-colors">+</button>
          </div>
        </div>
      );
    };

    const AmenitiesSection = ({ amenities, catalogue, panier, setPanier }) => {
      if (!amenities || Object.keys(amenities).length === 0) return null;
      const [showOtherFormats, setShowOtherFormats] = useState(false);

      const sections = AMENITY_TYPES
        .filter(type => amenities[type.key])
        .map(type => {
          const baseRef = amenities[type.key];
          const gammeInfo = type.gammes.find(g => g.ref === baseRef);
          const allProducts = catalogue.filter(p => p.ref === baseRef || p.ref.startsWith(baseRef + '-'));
          const mainProducts = allProducts.filter(p => isMainFormat(p.ref, baseRef));
          const otherProducts = allProducts.filter(p => !isMainFormat(p.ref, baseRef));
          return { type, baseRef, gammeInfo, mainProducts, otherProducts };
        })
        .filter(s => s.mainProducts.length > 0 || s.otherProducts.length > 0);

      if (sections.length === 0) return null;

      const hasOtherFormats = sections.some(s => s.otherProducts.length > 0);

      const getQty = (ref) => panier[ref]?.quantite || 0;

      const addCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        setPanier(p => ({ ...p, [ref]: { ...prod, quantite: getQty(ref) + moq } }));
      };

      const removeCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const next = getQty(ref) - moq;
        if (next <= 0) {
          setPanier(p => { const n = { ...p }; delete n[ref]; return n; });
        } else {
          setPanier(p => ({ ...p, [ref]: { ...prod, quantite: next } }));
        }
      };

      return (
        <div className="mb-8 space-y-6">
          {/* Section principale : 500ml et 5L */}
          <div>
            <div className="flex items-center gap-2 mb-4">
              <div className="w-1 h-5 bg-gold-500 rounded-full"></div>
              <h3 className="text-sm font-semibold text-gray-900">Vos produits en chambre</h3>
            </div>
            <div className="space-y-4">
              {sections.map(({ type, gammeInfo, mainProducts }) => (
                mainProducts.length > 0 && (
                  <div key={type.key} className="bg-white border border-gray-100 rounded-xl overflow-hidden">
                    <div className="px-3 py-2 bg-gray-50 border-b border-gray-100">
                      <span className="text-xs font-semibold text-gray-700">{type.label}</span>
                      <span className="text-xs text-gold-600 ml-1.5">{gammeInfo?.gamme || ''}</span>
                    </div>
                    <div className="divide-y divide-gray-50">
                      {mainProducts.map(p => (
                        <AmenityProductRow key={p.ref} p={p} getQty={getQty} addCarton={addCarton} removeCarton={removeCarton} />
                      ))}
                    </div>
                  </div>
                )
              ))}
            </div>
          </div>

          {/* Section secondaire : autres formats */}
          {hasOtherFormats && (
            <div>
              <button
                onClick={() => setShowOtherFormats(!showOtherFormats)}
                className="flex items-center gap-2 mb-3 group"
              >
                <div className="w-1 h-5 bg-gray-300 rounded-full"></div>
                <h3 className="text-sm font-medium text-gray-500 group-hover:text-gray-700 transition-colors">Autres formats disponibles <span className="font-normal text-gray-400">(mêmes parfums)</span></h3>
                <span className="text-gray-400 text-xs group-hover:text-gray-600 transition-colors">{showOtherFormats ? '\u25b2' : '\u25bc'}</span>
              </button>
              {showOtherFormats && (
                <div className="space-y-4 animate-fade-in">
                  {sections.map(({ type, gammeInfo, otherProducts }) => (
                    otherProducts.length > 0 && (
                      <div key={type.key} className="bg-white border border-gray-100 rounded-xl overflow-hidden">
                        <div className="px-3 py-2 bg-gray-50 border-b border-gray-100">
                          <span className="text-xs font-semibold text-gray-700">{type.label}</span>
                          <span className="text-xs text-gold-600 ml-1.5">{gammeInfo?.gamme || ''}</span>
                        </div>
                        <div className="divide-y divide-gray-50">
                          {otherProducts.map(p => (
                            <AmenityProductRow key={p.ref} p={p} getQty={getQty} addCarton={addCarton} removeCarton={removeCarton} />
                          ))}
                        </div>
                      </div>
                    )
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ─── Section Derni\u00e8re Commande ────────────────────────────────────────────
    const DerniereCommandeSection = ({ commandes, catalogue, setPanier, setPanierOpen, showToast }) => {
      const [open, setOpen] = useState(false);
      if (!commandes || commandes.length === 0) return null;

      const derniere = commandes[0];

      const handleRecommander = () => {
        const newPanier = {};
        derniere.products.forEach(p => {
          const prod = catalogue.find(c => c.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setPanierOpen(true);
        showToast('Panier rempli avec votre derni\u00e8re commande', 'success');
      };

      const statutConfig = {
        en_attente: { label: "En attente", bg: "bg-amber-50", text: "text-amber-700" },
        validee: { label: "Valid\u00e9e", bg: "bg-green-50", text: "text-green-700" },
        annulee: { label: "Annul\u00e9e", bg: "bg-red-50", text: "text-red-700" },
        annulee_client: { label: "Annul\u00e9e", bg: "bg-red-50", text: "text-red-700" },
      };
      const cfg = statutConfig[derniere.statut] || statutConfig.en_attente;

      return (
        <div className="mb-8">
          <button
            onClick={() => setOpen(!open)}
            className="flex items-center gap-2 mb-3 group"
          >
            <div className="w-1 h-5 bg-gold-400 rounded-full"></div>
            <h3 className="text-sm font-semibold text-gray-900">Votre dernière commande</h3>
            <span className="text-gray-400 text-xs group-hover:text-gray-600 transition-colors">{open ? '\u25b2' : '\u25bc'}</span>
          </button>
          {open && (
            <div className="bg-white border border-gray-200 rounded-xl p-4 animate-fade-in shadow-sm">
              <div className="flex items-center justify-between mb-3">
                <div className="text-xs text-gray-500">
                  {new Date(derniere.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}
                </div>
                <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${cfg.bg} ${cfg.text}`}>{cfg.label}</span>
              </div>
              <div className="space-y-1 mb-3">
                {derniere.products.map((p, i) => (
                  <div key={i} className="flex justify-between text-sm">
                    <span className="text-gray-600">{p.quantite}x {p.nom || p.ref}</span>
                    <span className="text-gray-900">{p.total_ht.toFixed(2)} &euro;</span>
                  </div>
                ))}
              </div>
              <div className="flex items-center justify-between border-t border-gray-100 pt-3">
                <div className="text-sm font-medium text-gray-900">Total: {derniere.total_ht.toFixed(2)} &euro; HT</div>
                <button
                  onClick={handleRecommander}
                  className="px-4 py-2 bg-gold-500 text-white text-xs font-medium rounded-lg hover:bg-gold-600 transition-colors"
                >
                  Re-commander
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── Catalogue ──────────────────────────────────────────────────────────────
    const CATEGORIES_ORDER = [
      'Cadeaux VIP & Spa',
      'Produits Spa',
      'Parfums & gel hydroalcoolique',
      'Produits hygiène format voyage',
      'Flacons 500 ml',
      'Recharges 5 litres',
      'Portes flacons',
      'Flacons vides',
      'Autres',
    ];

    const CatalogueView = ({ catalogue, panier, setPanier }) => {
      const [search, setSearch] = useState("");
      const [openCats, setOpenCats] = useState({});

      const filtered = useMemo(() => {
        if (!search) return catalogue;
        const q = search.toLowerCase();
        return catalogue.filter(p => p.ref.toLowerCase().includes(q) || p.nom.toLowerCase().includes(q) || (p.categorie || '').toLowerCase().includes(q));
      }, [catalogue, search]);

      const GAMME_ORDER = ['Insurrection', 'Irreverence', 'Reddition', 'Revelation', 'Radiance', 'Imminence'];
      const sortByGamme = (products) => {
        return [...products].sort((a, b) => {
          const nomA = (a.nom || '').toLowerCase();
          const nomB = (b.nom || '').toLowerCase();
          const idxA = GAMME_ORDER.findIndex(g => nomA.includes(g.toLowerCase()));
          const idxB = GAMME_ORDER.findIndex(g => nomB.includes(g.toLowerCase()));
          const gA = idxA >= 0 ? idxA : GAMME_ORDER.length;
          const gB = idxB >= 0 ? idxB : GAMME_ORDER.length;
          if (gA !== gB) return gA - gB;
          return nomA.localeCompare(nomB);
        });
      };

      const grouped = useMemo(() => {
        const groups = {};
        for (const p of filtered) {
          const cat = p.categorie || 'Autres';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(p);
        }
        const ordered = [];
        for (const cat of CATEGORIES_ORDER) {
          if (groups[cat]) ordered.push({ categorie: cat, products: sortByGamme(groups[cat]) });
        }
        for (const cat of Object.keys(groups)) {
          if (!CATEGORIES_ORDER.includes(cat)) ordered.push({ categorie: cat, products: sortByGamme(groups[cat]) });
        }
        return ordered;
      }, [filtered]);

      useEffect(() => {
        if (search && search.length >= 2) {
          setOpenCats(prev => {
            const next = { ...prev };
            for (const g of grouped) next[g.categorie] = true;
            return next;
          });
        }
      }, [search, grouped]);

      const toggleCat = (cat) => setOpenCats(prev => ({ ...prev, [cat]: !prev[cat] }));

      const getQty = (ref) => panier[ref]?.quantite || 0;

      const addCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const current = getQty(ref);
        setPanier(p => ({ ...p, [ref]: { ...prod, quantite: current + moq } }));
      };

      const removeCarton = (ref) => {
        const prod = catalogue.find(c => c.ref === ref);
        const moq = prod.moq || 1;
        const current = getQty(ref);
        const next = current - moq;
        if (next <= 0) {
          setPanier(p => { const n = { ...p }; delete n[ref]; return n; });
        } else {
          setPanier(p => ({ ...p, [ref]: { ...prod, quantite: next } }));
        }
      };

      const panierCountByCat = useMemo(() => {
        const counts = {};
        for (const ref of Object.keys(panier)) {
          const prod = catalogue.find(c => c.ref === ref);
          if (prod) {
            const cat = prod.categorie || 'Autres';
            counts[cat] = (counts[cat] || 0) + 1;
          }
        }
        return counts;
      }, [panier, catalogue]);

      return (
        <div>
          {/* Barre de recherche */}
          <div className="mb-6">
            <div className="relative">
              <input
                type="text"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Rechercher un produit..."
                className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gold-500/50 focus:border-gold-500/40"
              />
              {search && (
                <button onClick={() => setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg px-1">&times;</button>
              )}
            </div>
          </div>

          {/* Cat\u00e9gories */}
          {grouped.map(({ categorie, products }) => {
            const isOpen = !!openCats[categorie];
            const catPanierCount = panierCountByCat[categorie] || 0;
            return (
              <div key={categorie} className="mb-3">
                <button
                  onClick={() => toggleCat(categorie)}
                  className="w-full flex items-center gap-2 px-3 py-3 rounded-xl bg-gray-50 hover:bg-gray-100 transition-colors"
                >
                  <span className={`text-gray-400 text-xs transition-transform ${isOpen ? 'rotate-90' : ''}`} style={{display:'inline-block'}}>&#9654;</span>
                  <span className="text-sm font-semibold text-gray-900 flex-1 text-left">{categorie}</span>
                  <span className="text-xs text-gray-400">{products.length}</span>
                  {catPanierCount > 0 && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-gold-100 text-gold-700 font-medium">{catPanierCount} au panier</span>
                  )}
                </button>

                {isOpen && (
                  <div className="mt-1 space-y-0.5">
                    {products.map(p => {
                      const moq = p.moq || 1;
                      const qty = getQty(p.ref);
                      const cartons = moq > 1 ? Math.floor(qty / moq) : qty;
                      const inCart = qty > 0;
                      return (
                        <div
                          key={p.ref}
                          className={`flex items-center gap-2 px-3 py-2.5 rounded-lg transition-colors ${inCart ? 'bg-gold-50 border-l-2 border-l-gold-500' : 'hover:bg-gray-50'}`}
                        >
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-[10px] text-gray-400 shrink-0">{p.ref}</span>
                              <span className="text-xs sm:text-sm text-gray-900 truncate">{p.nom}</span>
                            </div>
                            <div className="flex items-center gap-2 mt-0.5">
                              <span className="text-xs font-semibold text-gold-600">{p.prix_remise.toFixed(2)} &euro; HT</span>
                              {p.discount_pct > 0 && (
                                <span className="text-[10px] px-1 py-0.5 rounded bg-gold-100 text-gold-700 font-medium">-{p.discount_pct}%</span>
                              )}
                              {moq > 1 && (
                                <span className="text-[10px] text-gray-400">carton de {moq}</span>
                              )}
                            </div>
                          </div>
                          <div className="flex items-center gap-1 shrink-0">
                            {qty > 0 && (
                              <button onClick={() => removeCarton(p.ref)} className="w-9 h-9 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center text-base font-bold transition-colors">-</button>
                            )}
                            {qty > 0 && (
                              <div className="text-center min-w-[32px]">
                                <div className="text-gray-900 font-semibold text-sm">{moq > 1 ? cartons : qty}</div>
                                {moq > 1 && <div className="text-[9px] text-gray-400 leading-none">{qty} u.</div>}
                              </div>
                            )}
                            <button onClick={() => addCarton(p.ref)} className="w-9 h-9 rounded-lg bg-gold-500 text-white hover:bg-gold-600 flex items-center justify-center text-base font-bold transition-colors">+</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
          {filtered.length === 0 && (
            <div className="text-center py-12 text-gray-400 text-sm">Aucun produit trouv&eacute;</div>
          )}
        </div>
      );
    };

    // ─── Panier Panel ───────────────────────────────────────────────────────────
    const PanierPanel = ({ panier, setPanier, onCommander, loading, partner, modifyingOrderId, initialNotes }) => {
      const [notes, setNotes] = useState(initialNotes || "");
      const [showConfirm, setShowConfirm] = useState(false);
      const confirmRef = useRef(null);
      const items = Object.values(panier);
      const subtotalHT = items.reduce((s, i) => s + i.prix_remise * i.quantite, 0);
      const francoSeuil = partner.franco_seuil ?? 800;
      const exonere = partner.frais_exonere ?? 0;
      const fpPrix = partner.fp_prix ?? 0;
      const fePrix = partner.fe_prix ?? 0;

      let fraisLabel = '';
      let fraisMontant = 0;
      let francoAtteint = subtotalHT >= francoSeuil;
      if (!exonere) {
        if (francoAtteint) {
          fraisLabel = 'Frais de pr\u00e9paration (FP)';
          fraisMontant = fpPrix;
        } else {
          fraisLabel = "Frais d'exp\u00e9dition (FE)";
          fraisMontant = fePrix;
        }
      }
      const totalHT = subtotalHT + fraisMontant;
      const tvaParProduit = items.reduce((s, i) => s + i.prix_remise * i.quantite * ((i.tva || 20) / 100), 0);
      const tvaSurFrais = fraisMontant * 0.2;
      const totalTTC = totalHT + tvaParProduit + tvaSurFrais;
      const manquePourFranco = Math.max(0, francoSeuil - subtotalHT);

      if (items.length === 0) {
        return (
          <div className="space-y-4">
            <div className="text-center py-8 text-gray-400 text-sm">
              Votre panier est vide.<br />Ajoutez des produits depuis le catalogue.
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 space-y-1">
              <div className="font-semibold text-amber-900 mb-1">Conditions :</div>
              <ul className="list-disc list-inside space-y-0.5">
                <li>Franco port {francoSeuil.toFixed(0)} &euro; HT en France et 1&nbsp;500 &euro; HT &agrave; l'&eacute;tranger (FE)</li>
                <li>Frais de pr&eacute;paration (FP) de commande = {fpPrix > 0 ? fpPrix.toFixed(0) : '25'} &euro; HT</li>
                <li>Si Franco pas atteint, frais de port = {fePrix > 0 ? fePrix.toFixed(0) : '80'} &euro; HT (FP inclus)</li>
                <li>Conditionnement : bidons par cartons de 4, flacons par cartons de 6.</li>
              </ul>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-4">
          {items.map(i => {
            const moq = i.moq || 1;
            const cartons = moq > 1 ? Math.floor(i.quantite / moq) : i.quantite;
            return (
              <div key={i.ref} className="bg-gray-50 rounded-xl p-3">
                <div className="flex items-center justify-between">
                  <div className="min-w-0 flex-1">
                    <div className="text-xs text-gray-400 font-mono">{i.ref}</div>
                    <div className="text-sm text-gray-900 truncate">{i.nom}</div>
                    <div className="flex items-center gap-2 mt-0.5">
                      {i.discount_pct > 0 ? (
                        <>
                          <span className="text-xs text-gray-400 line-through">{i.prix_ht.toFixed(2)} &euro;</span>
                          <span className="text-xs text-gold-600">{i.prix_remise.toFixed(2)} &euro; HT/u</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-gold-100 text-gold-700 font-medium">-{i.discount_pct}%</span>
                        </>
                      ) : (
                        <span className="text-xs text-gray-500">{i.prix_remise.toFixed(2)} &euro; HT/u</span>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-3 ml-3">
                    <div className="flex items-center gap-1">
                      <button onClick={() => setPanier(p => {
                        const next = i.quantite - moq;
                        if (next <= 0) { const n = { ...p }; delete n[i.ref]; return n; }
                        return { ...p, [i.ref]: { ...i, quantite: next } };
                      })} className="w-8 h-8 rounded-lg bg-gray-200 text-gray-600 text-sm hover:bg-gray-300 flex items-center justify-center">-</button>
                      <div className="text-center min-w-[32px]">
                        <div className="text-gray-900 text-sm font-semibold">{moq > 1 ? cartons : i.quantite}</div>
                        {moq > 1 && <div className="text-[9px] text-gray-400 leading-none">{i.quantite} u.</div>}
                      </div>
                      <button onClick={() => setPanier(p => ({ ...p, [i.ref]: { ...i, quantite: i.quantite + moq } }))} className="w-8 h-8 rounded-lg bg-gray-200 text-gray-600 text-sm hover:bg-gray-300 flex items-center justify-center">+</button>
                    </div>
                    <div className="text-sm text-gray-900 font-medium w-20 text-right">{(i.prix_remise * i.quantite).toFixed(2)} &euro;</div>
                  </div>
                </div>
              </div>
            );
          })}

          {/* Barre de progression franco */}
          {!exonere && (
            <div className="bg-gray-50 rounded-xl p-3">
              <div className="flex justify-between text-[11px] mb-1.5">
                <span className={francoAtteint ? "text-gold-600 font-medium" : "text-gray-500"}>
                  {francoAtteint ? 'Franco atteint !' : `Encore ${manquePourFranco.toFixed(2)} \u20ac pour le franco`}
                </span>
                <span className="text-gray-400">{subtotalHT.toFixed(0)} / {francoSeuil.toFixed(0)} &euro; HT</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-1.5">
                <div
                  className={`h-1.5 rounded-full transition-all ${francoAtteint ? 'bg-gold-500' : 'bg-amber-500'}`}
                  style={{ width: `${Math.min(100, (subtotalHT / francoSeuil) * 100)}%` }}
                />
              </div>
              <div className="text-[10px] mt-1 text-gray-400">
                {francoAtteint
                  ? `Frais de pr\u00e9paration : ${fpPrix.toFixed(2)} \u20ac HT (au lieu de ${fePrix.toFixed(2)} \u20ac d'exp\u00e9dition)`
                  : `Frais d'exp\u00e9dition : ${fePrix.toFixed(2)} \u20ac HT`
                }
              </div>
            </div>
          )}

          <div className="border-t border-gray-200 pt-4 space-y-2">
            <div className="flex justify-between text-sm text-gray-500">
              <span>Sous-total HT</span>
              <span>{subtotalHT.toFixed(2)} &euro;</span>
            </div>
            {!exonere && (
              <div className={`flex justify-between text-sm ${francoAtteint ? 'text-gold-600' : 'text-amber-600'}`}>
                <span>{fraisLabel}</span>
                <span>{fraisMontant.toFixed(2)} &euro;</span>
              </div>
            )}
            {exonere === 1 && (
              <div className="flex justify-between text-sm text-green-600">
                <span>Frais</span>
                <span>Exon&eacute;r&eacute;</span>
              </div>
            )}
            <div className="flex justify-between text-sm text-gray-900 font-semibold">
              <span>Total HT</span>
              <span>{totalHT.toFixed(2)} &euro;</span>
            </div>
            <div className="flex justify-between text-sm text-gray-400">
              <span>Total TTC</span>
              <span>{totalTTC.toFixed(2)} &euro;</span>
            </div>
          </div>
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 space-y-1">
            <div className="font-semibold text-amber-900 mb-1">Conditions :</div>
            <ul className="list-disc list-inside space-y-0.5">
              <li>Franco port {francoSeuil.toFixed(0)} &euro; HT en France et 1&nbsp;500 &euro; HT &agrave; l'&eacute;tranger (FE)</li>
              <li>Frais de pr&eacute;paration (FP) de commande = {fpPrix > 0 ? fpPrix.toFixed(0) : '25'} &euro; HT</li>
              <li>Si Franco pas atteint, frais de port = {fePrix > 0 ? fePrix.toFixed(0) : '80'} &euro; HT (FP inclus)</li>
              <li>Conditionnement : bidons par cartons de 4, flacons par cartons de 6.</li>
            </ul>
          </div>
          <textarea
            value={notes}
            onChange={e => setNotes(e.target.value)}
            placeholder="Notes ou instructions (optionnel)..."
            className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gold-500/50 resize-none"
            rows={3}
          />

          {/* Ecran de confirmation (point 6) */}
          {showConfirm ? (
            <div ref={confirmRef} className="bg-gold-50 border border-gold-200 rounded-xl p-4 space-y-3 animate-fade-in">
              <div className="text-sm font-semibold text-gray-900">R&eacute;capitulatif de votre commande</div>
              <div className="space-y-1 max-h-40 overflow-y-auto">
                {items.map(i => (
                  <div key={i.ref} className="flex justify-between text-xs text-gray-700">
                    <span>{i.quantite}x {i.nom}</span>
                    <span>{(i.prix_remise * i.quantite).toFixed(2)} &euro;</span>
                  </div>
                ))}
              </div>
              <div className="border-t border-gold-200 pt-2 space-y-1">
                {!exonere && fraisMontant > 0 && (
                  <div className="flex justify-between text-xs text-gray-500">
                    <span>{fraisLabel}</span>
                    <span>{fraisMontant.toFixed(2)} &euro;</span>
                  </div>
                )}
                <div className="flex justify-between text-sm font-semibold text-gray-900">
                  <span>Total HT</span>
                  <span>{totalHT.toFixed(2)} &euro;</span>
                </div>
                <div className="flex justify-between text-xs text-gray-400">
                  <span>Total TTC</span>
                  <span>{totalTTC.toFixed(2)} &euro;</span>
                </div>
              </div>
              {notes && <div className="text-xs text-gray-500 italic">Note : "{notes}"</div>}
              <div className="flex gap-2">
                <button
                  onClick={() => setShowConfirm(false)}
                  className="flex-1 py-2.5 rounded-xl text-sm font-medium border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors"
                >
                  Modifier
                </button>
                <button
                  onClick={() => { setShowConfirm(false); onCommander(notes); }}
                  disabled={loading}
                  className="flex-1 bg-gold-500 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-gold-600 transition-colors disabled:opacity-50"
                >
                  {loading ? "Envoi..." : "Confirmer"}
                </button>
              </div>
            </div>
          ) : (
            <button
              onClick={() => { setShowConfirm(true); setTimeout(() => confirmRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); }}
              disabled={loading}
              className="w-full bg-gold-500 text-white py-3 rounded-xl text-sm font-semibold hover:bg-gold-600 transition-colors disabled:opacity-50"
            >
              {loading ? "Envoi en cours..." : modifyingOrderId ? `Enregistrer les modifications (${totalHT.toFixed(2)} \u20ac HT)` : `Commander (${totalHT.toFixed(2)} \u20ac HT)`}
            </button>
          )}
        </div>
      );
    };

    // ─── Historique ─────────────────────────────────────────────────────────────
    const HistoriqueView = ({ commandes, onRefresh, catalogue, setPanier, setPanierOpen, setVue, setModifyingOrderId, setModifyingNotes, showToast, partner }) => {
      const [cancelling, setCancelling] = useState(null);
      const [filtre, setFiltre] = useState('tous');
      const [expandedId, setExpandedId] = useState(null);
      const [pageSize] = useState(20);
      const [visibleCount, setVisibleCount] = useState(20);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const toggleSelect = (id) => setSelectedIds(prev => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });
      const statutConfig = {
        en_attente: { label: "En attente", bg: "bg-amber-50", text: "text-amber-700" },
        validee: { label: "Valid\u00e9e", bg: "bg-green-50", text: "text-green-700" },
        annulee: { label: "Annul\u00e9e", bg: "bg-red-50", text: "text-red-700" },
        annulee_client: { label: "Annul\u00e9e", bg: "bg-red-50", text: "text-red-700" },
      };

      const handleCancel = async (id) => {
        if (!confirm('Annuler cette commande ?')) return;
        setCancelling(id);
        try {
          const res = await api.del(`/commande/${id}`);
          if (res.erreur) { showToast(res.erreur, 'error'); }
          else { showToast('Commande annul\u00e9e', 'success'); onRefresh(); }
        } catch (e) { showToast('Erreur annulation', 'error'); }
        setCancelling(null);
      };

      const handleModify = (c) => {
        const newPanier = {};
        c.products.forEach(p => {
          const prod = catalogue.find(cat => cat.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          } else {
            newPanier[p.ref] = { ref: p.ref, nom: p.nom, prix_ht: p.prix_ht, prix_remise: p.prix_remise, discount_pct: p.discount_pct || 0, moq: 1, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setModifyingOrderId(c.id);
        setModifyingNotes(c.notes || "");
        setPanierOpen(true);
        setVue('catalogue');
        showToast('Commande charg\u00e9e dans le panier \u2014 validez pour enregistrer les modifications', 'info');
      };

      const handleReorder = (c) => {
        const newPanier = {};
        c.products.forEach(p => {
          const prod = catalogue.find(cat => cat.ref === p.ref);
          if (prod) {
            newPanier[p.ref] = { ...prod, quantite: p.quantite };
          } else {
            newPanier[p.ref] = { ref: p.ref, nom: p.nom, prix_ht: p.prix_ht, prix_remise: p.prix_remise, discount_pct: p.discount_pct || 0, tva: p.tva || 20, moq: 1, quantite: p.quantite };
          }
        });
        setPanier(newPanier);
        setPanierOpen(true);
        setVue('catalogue');
        showToast('Panier rempli \u2014 vous pouvez ajuster avant de commander', 'success');
      };

      const exportCsv = () => {
        const toExport = selectedIds.size > 0 ? commandes.filter(c => selectedIds.has(c.id)) : commandes;
        if (toExport.length === 0) { showToast('Aucune commande \u00e0 exporter', 'error'); return; }
        const rows = [['Date', 'Statut', 'Facture', 'R\u00e9f\u00e9rence', 'Produit', 'Quantit\u00e9', 'Prix unitaire HT', 'Total ligne HT', 'Total commande HT', 'Total commande TTC', 'Notes']];
        for (const c of toExport) {
          const cfg = statutConfig[c.statut] || {};
          const date = new Date(c.created_at).toLocaleDateString('fr-FR');
          for (const p of c.products) {
            rows.push([
              date,
              cfg.label || c.statut,
              c.vf_invoice_number || '',
              p.ref,
              (p.nom || '').replace(/"/g, '""'),
              p.quantite,
              p.prix_remise.toFixed(2),
              p.total_ht.toFixed(2),
              c.total_ht.toFixed(2),
              c.total_ttc.toFixed(2),
              (c.notes || '').replace(/"/g, '""'),
            ]);
          }
        }
        const csv = rows.map(r => r.map(v => `"${v}"`).join(';')).join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `commandes-${partner.nom || 'export'}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`${toExport.length} commande${toExport.length > 1 ? 's' : ''} export\u00e9e${toExport.length > 1 ? 's' : ''}`, 'success');
        setSelectedIds(new Set());
      };

      const filtreOptions = [
        { key: 'tous', label: 'Toutes' },
        { key: 'en_attente', label: 'En attente' },
        { key: 'validee', label: 'Valid\u00e9es' },
        { key: 'expediee', label: 'Exp\u00e9di\u00e9es' },
        { key: 'livree', label: 'Livr\u00e9es' },
        { key: 'annulee', label: 'Annul\u00e9es' },
      ];

      const filtered = filtre === 'tous'
        ? commandes
        : filtre === 'annulee' ? commandes.filter(c => c.statut === 'annulee' || c.statut === 'annulee_client')
        : filtre === 'expediee' ? commandes.filter(c => c.statut === 'validee' && c.tracking_number && !c.delivered_at)
        : filtre === 'livree' ? commandes.filter(c => c.statut === 'validee' && c.delivered_at)
        : commandes.filter(c => c.statut === filtre);

      const handleDownloadPdf = async (c) => {
        try {
          const token = sessionStorage.getItem('partner_token') || '';
          const res = await fetch(`${API_BASE}/commande/${c.id}/pdf`, { headers: { 'Authorization': 'Bearer ' + token } });
          if (!res.ok) { showToast('Facture non disponible', 'error'); return; }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `facture-${c.vf_invoice_number || c.id}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {
          showToast('Erreur t\u00e9l\u00e9chargement facture', 'error');
        }
      };

      if (commandes.length === 0) {
        return <div className="text-center py-12 text-gray-400 text-sm">Aucune commande pass&eacute;e.</div>;
      }

      return (
        <div className="space-y-4">
          {/* Filtres par statut */}
          <div className="flex gap-1 bg-gray-100 rounded-xl p-1">
            {filtreOptions.map(f => {
              const count = f.key === 'tous' ? commandes.length
                : f.key === 'annulee' ? commandes.filter(c => c.statut === 'annulee' || c.statut === 'annulee_client').length
                : commandes.filter(c => c.statut === f.key).length;
              return (
                <button key={f.key} onClick={() => setFiltre(f.key)}
                  className={`flex-1 px-3 py-2 rounded-lg text-xs font-medium transition-colors ${filtre === f.key ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'}`}>
                  {f.label} <span className="text-gray-400 ml-0.5">({count})</span>
                </button>
              );
            })}
          </div>

          {/* Barre d'actions export */}
          <div className="flex items-center justify-between">
            <div className="text-xs text-gray-400">
              {selectedIds.size > 0 && `${selectedIds.size} s\u00e9lectionn\u00e9e${selectedIds.size > 1 ? 's' : ''}`}
            </div>
            <div className="flex items-center gap-2">
              {selectedIds.size > 0 && (
                <button onClick={() => setSelectedIds(new Set())} className="text-xs text-gray-400 hover:text-gray-600 transition-colors">
                  D&eacute;s&eacute;lectionner
                </button>
              )}
              <button onClick={exportCsv}
                className="text-xs px-3 py-2 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1">
                &#128196; Exporter {selectedIds.size > 0 ? `(${selectedIds.size})` : 'tout'} en CSV
              </button>
            </div>
          </div>

          {filtered.length === 0 && (
            <div className="text-center py-8 text-gray-400 text-sm">Aucune commande dans cette cat&eacute;gorie.</div>
          )}

          {filtered.slice(0, visibleCount).map(c => {
            const cfg = statutConfig[c.statut] || statutConfig.en_attente;
            const isExpanded = expandedId === c.id;
            const isSelected = selectedIds.has(c.id);
            return (
              <div key={c.id} className={`bg-white border rounded-2xl shadow-sm overflow-hidden transition-colors ${isSelected ? 'border-gold-400 ring-1 ring-gold-200' : 'border-gray-200'}`}>
                {/* En-tête cliquable */}
                <div className="flex items-center">
                  <label className="flex items-center justify-center w-10 shrink-0 cursor-pointer" onClick={e => e.stopPropagation()}>
                    <input type="checkbox" checked={isSelected} onChange={() => toggleSelect(c.id)}
                      className="w-4 h-4 rounded border-gray-300 text-gold-500 focus:ring-gold-500/30 cursor-pointer" />
                  </label>
                <button onClick={() => setExpandedId(isExpanded ? null : c.id)} className="flex-1 flex items-center justify-between p-4 pl-0 text-left hover:bg-gray-50/50 transition-colors">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <span className="text-xs text-gray-500">{new Date(c.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-medium ${cfg.bg} ${cfg.text}`}>{cfg.label}</span>
                      {c.statut === 'validee' && c.delivered_at && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 text-emerald-700">Livr&eacute;e</span>}
                      {c.statut === 'validee' && c.tracking_number && !c.delivered_at && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-blue-50 text-blue-700">Exp&eacute;di&eacute;e</span>}
                      {c.statut === 'validee' && !c.tracking_number && !c.delivered_at && <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-purple-50 text-purple-600">En pr&eacute;paration</span>}
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-semibold text-gray-900">{c.total_ht.toFixed(2)} &euro; HT</span>
                      <span className="text-xs text-gray-400">{c.products.length} produit{c.products.length > 1 ? 's' : ''}</span>
                      {c.vf_invoice_number && <span className="text-[10px] px-1.5 py-0.5 rounded bg-green-50 text-green-700 font-medium">Facture n&deg;{c.vf_invoice_number}</span>}
                    </div>
                  </div>
                  <span className={`text-gray-400 text-xs transition-transform ${isExpanded ? 'rotate-180' : ''}`}>&#9660;</span>
                </button>
                </div>

                {/* Détail déplié */}
                {isExpanded && (
                  <div className="px-5 pb-5 border-t border-gray-100 animate-fade-in">
                    <div className="space-y-1.5 py-3">
                      {c.products.map((p, i) => (
                        <div key={i} className="flex items-center justify-between text-sm">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="font-mono text-[10px] text-gray-400 shrink-0">{p.ref}</span>
                            <span className="text-gray-700 truncate">{p.nom}</span>
                            {p.discount_pct > 0 && <span className="text-[10px] px-1 py-0.5 rounded bg-gold-100 text-gold-700 font-medium shrink-0">-{p.discount_pct}%</span>}
                          </div>
                          <div className="flex items-center gap-3 shrink-0 ml-2">
                            <span className="text-xs text-gray-400">{p.quantite} u. &times; {p.prix_remise.toFixed(2)} &euro;</span>
                            <span className="text-gray-900 font-medium w-20 text-right">{p.total_ht.toFixed(2)} &euro;</span>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="border-t border-gray-100 pt-2 space-y-1">
                      {c.frais_montant > 0 && (
                        <div className="flex justify-between text-xs text-gray-500">
                          <span>{c.frais_ref === 'FP' ? 'Frais de pr\u00e9paration' : "Frais d'exp\u00e9dition"}</span>
                          <span>{c.frais_montant.toFixed(2)} &euro;</span>
                        </div>
                      )}
                      <div className="flex justify-between text-sm font-semibold text-gray-900">
                        <span>Total HT</span>
                        <span>{c.total_ht.toFixed(2)} &euro;</span>
                      </div>
                      <div className="flex justify-between text-xs text-gray-400">
                        <span>Total TTC</span>
                        <span>{c.total_ttc.toFixed(2)} &euro;</span>
                      </div>
                    </div>
                    {c.notes && <div className="text-xs text-gray-400 mt-3 italic border-t border-gray-50 pt-2">Note : "{c.notes}"</div>}

                    {/* Suivi exp&eacute;dition */}
                    {c.statut === 'validee' && (
                      <div className="mt-3 pt-3 border-t border-gray-100">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="text-xs font-semibold text-gray-700">Suivi exp&eacute;dition</span>
                        </div>
                        {c.delivered_at ? (
                          <div className="flex items-center gap-2 text-sm text-emerald-700 bg-emerald-50 rounded-xl px-3 py-2">
                            <span>&#9989;</span>
                            <span>Livr&eacute;e le {new Date(c.delivered_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                          </div>
                        ) : c.tracking_number ? (
                          <div className="flex items-center gap-2 text-sm text-blue-700 bg-blue-50 rounded-xl px-3 py-2">
                            <span>&#128230;</span>
                            <span>Exp&eacute;di&eacute;e{c.shipped_at ? ` le ${new Date(c.shipped_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}` : ''}</span>
                            {c.tracking_url && (
                              <a href={c.tracking_url} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                                className="ml-auto text-xs px-2 py-1 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-lg transition-colors font-medium">
                                Suivre mon colis
                              </a>
                            )}
                          </div>
                        ) : (
                          <div className="flex items-center gap-2 text-sm text-purple-600 bg-purple-50 rounded-xl px-3 py-2">
                            <span>&#128230;</span>
                            <span>En pr&eacute;paration chez le logisticien</span>
                          </div>
                        )}
                      </div>
                    )}

                    <div className="flex flex-wrap gap-2 mt-3 pt-2 border-t border-gray-100">
                      {c.statut === 'en_attente' && (
                        <>
                          <button onClick={() => handleModify(c)} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-gold-50 text-gold-700 hover:bg-gold-100 transition-colors">
                            Modifier
                          </button>
                          <button onClick={() => handleCancel(c.id)} disabled={cancelling === c.id} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors disabled:opacity-50">
                            {cancelling === c.id ? 'Annulation...' : 'Annuler'}
                          </button>
                        </>
                      )}
                      <button onClick={() => handleReorder(c)} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors">
                        Commander de nouveau
                      </button>
                      {c.vf_invoice_number && (
                        <button onClick={() => handleDownloadPdf(c)} className="text-xs px-3 py-2 min-h-[36px] rounded-lg bg-green-50 text-green-700 hover:bg-green-100 transition-colors flex items-center gap-1">
                          &#128196; Facture
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}

          {/* Pagination */}
          {filtered.length > visibleCount && (
            <div className="text-center py-3">
              <button onClick={() => setVisibleCount(v => v + pageSize)}
                className="text-xs px-6 py-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 text-gray-600 transition-colors">
                Charger plus ({filtered.length - visibleCount} restante{filtered.length - visibleCount > 1 ? 's' : ''})
              </button>
            </div>
          )}

        </div>
      );
    };

    // ─── Profil ──────────────────────────────────────────────────────────────────
    const ProfilView = ({ partner, setPartner, commandes, showToast }) => {
      // Pré-remplir les contacts avec les infos générales si vides
      const nameParts = (partner.contact_nom || '').trim().split(/\s+/);
      const defaultPrenom = nameParts.length > 1 ? nameParts.slice(0, -1).join(' ') : nameParts[0] || '';
      const defaultNom = nameParts.length > 1 ? nameParts[nameParts.length - 1] : '';
      const [form, setForm] = useState({
        contact_nom: partner.contact_nom || '',
        email: partner.email || '',
        telephone: partner.telephone || '',
        adresse: partner.adresse || '',
        livraison_prenom: partner.livraison_prenom || defaultPrenom,
        livraison_nom: partner.livraison_nom || defaultNom,
        livraison_telephone: partner.livraison_telephone || partner.telephone || '',
        livraison_email: partner.livraison_email || partner.email || '',
        facturation_prenom: partner.facturation_prenom || defaultPrenom,
        facturation_nom: partner.facturation_nom || defaultNom,
        facturation_telephone: partner.facturation_telephone || partner.telephone || '',
        facturation_email: partner.facturation_email || partner.email || '',
      });
      const [saving, setSaving] = useState(false);

      const set = (key, val) => setForm(f => ({ ...f, [key]: val }));

      const handleSave = async () => {
        setSaving(true);
        try {
          const res = await api.patch('/profil', form);
          if (res.erreur) { showToast(res.erreur, 'error'); }
          else {
            setPartner(p => ({ ...p, ...form }));
            showToast('Profil mis \u00e0 jour', 'success');
          }
        } catch (e) { showToast('Erreur sauvegarde', 'error'); }
        setSaving(false);
      };

      const fieldClass = "w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gold-500/50 focus:border-gold-500/40";

      return (
        <div className="max-w-lg mx-auto animate-fade-in">
          <h2 className="text-lg font-semibold text-gray-900 mb-4">Mon compte</h2>

          <div className="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm space-y-5">
            {/* En-tête */}
            <div className="flex items-center gap-3 pb-4 border-b border-gray-100">
              <div className="w-12 h-12 rounded-full bg-gold-100 flex items-center justify-center text-gold-700 font-semibold text-lg">
                {(partner.nom || '?')[0]}
              </div>
              <div>
                <div className="text-sm font-semibold text-gray-900">{partner.nom}</div>
                <div className="text-xs text-gray-400">{commandes.length} commande{commandes.length > 1 ? 's' : ''}</div>
              </div>
            </div>

            {/* Informations générales */}
            <div className="space-y-3">
              <div className="text-xs font-semibold text-gray-700 uppercase tracking-wide">Informations générales</div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Nom du contact</label>
                <input value={form.contact_nom} onChange={e => set('contact_nom', e.target.value)} placeholder="Prénom Nom" className={fieldClass} />
              </div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Email</label>
                <input value={form.email} onChange={e => set('email', e.target.value)} placeholder="email@exemple.com" type="email" className={fieldClass} />
              </div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Téléphone</label>
                <input value={form.telephone} onChange={e => set('telephone', e.target.value)} placeholder="+33..." type="tel" className={fieldClass} />
              </div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Adresse</label>
                <input value={form.adresse} onChange={e => set('adresse', e.target.value)} placeholder="Adresse complète" className={fieldClass} />
              </div>
            </div>

            {/* Contact livraison */}
            <div className="space-y-3 pt-4 border-t border-gray-100">
              <div className="text-xs font-semibold text-gray-700 uppercase tracking-wide">Contact de livraison</div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-medium text-gray-500 mb-1 block">Prénom</label>
                  <input value={form.livraison_prenom} onChange={e => set('livraison_prenom', e.target.value)} placeholder="Prénom" className={fieldClass} />
                </div>
                <div>
                  <label className="text-xs font-medium text-gray-500 mb-1 block">Nom</label>
                  <input value={form.livraison_nom} onChange={e => set('livraison_nom', e.target.value)} placeholder="Nom" className={fieldClass} />
                </div>
              </div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Téléphone</label>
                <input value={form.livraison_telephone} onChange={e => set('livraison_telephone', e.target.value)} placeholder="+33..." type="tel" className={fieldClass} />
              </div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Email</label>
                <input value={form.livraison_email} onChange={e => set('livraison_email', e.target.value)} placeholder="email@exemple.com" type="email" className={fieldClass} />
              </div>
            </div>

            {/* Contact facturation */}
            <div className="space-y-3 pt-4 border-t border-gray-100">
              <div className="text-xs font-semibold text-gray-700 uppercase tracking-wide">Contact de facturation</div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-medium text-gray-500 mb-1 block">Prénom</label>
                  <input value={form.facturation_prenom} onChange={e => set('facturation_prenom', e.target.value)} placeholder="Prénom" className={fieldClass} />
                </div>
                <div>
                  <label className="text-xs font-medium text-gray-500 mb-1 block">Nom</label>
                  <input value={form.facturation_nom} onChange={e => set('facturation_nom', e.target.value)} placeholder="Nom" className={fieldClass} />
                </div>
              </div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Téléphone</label>
                <input value={form.facturation_telephone} onChange={e => set('facturation_telephone', e.target.value)} placeholder="+33..." type="tel" className={fieldClass} />
              </div>
              <div>
                <label className="text-xs font-medium text-gray-500 mb-1 block">Email</label>
                <input value={form.facturation_email} onChange={e => set('facturation_email', e.target.value)} placeholder="email@exemple.com" type="email" className={fieldClass} />
              </div>
            </div>

            {/* Bouton sauvegarder */}
            <button onClick={handleSave} disabled={saving}
              className="w-full bg-gold-500 text-white py-3 rounded-xl text-sm font-semibold hover:bg-gold-600 transition-colors disabled:opacity-50">
              {saving ? 'Sauvegarde...' : 'Enregistrer'}
            </button>
          </div>
        </div>
      );
    };

    // ─── App Principale ─────────────────────────────────────────────────────────
    const App = () => {
      const [partner, setPartner] = useState(null);
      const [vue, setVue] = useState("catalogue");
      const [catalogue, setCatalogue] = useState([]);
      const [panier, setPanierRaw] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tdm_panier') || '{}'); } catch { return {}; }
      });
      const setPanier = (v) => setPanierRaw(prev => {
        const next = typeof v === 'function' ? v(prev) : v;
        localStorage.setItem('tdm_panier', JSON.stringify(next));
        return next;
      });
      const [commandes, setCommandes] = useState([]);
      const [panierOpen, setPanierOpen] = useState(false);
      const [modifyingOrderId, setModifyingOrderId] = useState(null);
      const [modifyingNotes, setModifyingNotes] = useState("");
      const [loading, setLoading] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(false);
      const [toast, setToast] = useState(null);
      const [amenities, setAmenities] = useState(null);

      const showToast = (message, type = "info") => {
        setToast({ message, type, visible: true });
        setTimeout(() => setToast(t => t ? { ...t, visible: false } : null), 4000);
      };

      useEffect(() => {
        const token = sessionStorage.getItem('partner_token');
        if (token) {
          api.get('/profil').then(res => {
            if (res.erreur) {
              sessionStorage.removeItem('partner_token');
            } else {
              setPartner(res);
              try { setAmenities(res.amenities ? JSON.parse(res.amenities) : null); } catch (e) { setAmenities(null); }
            }
          }).catch(() => sessionStorage.removeItem('partner_token'));
        }
      }, []);

      useEffect(() => {
        if (!partner) return;
        api.get('/catalogue').then(data => { if (Array.isArray(data)) setCatalogue(data); });
        api.get('/commandes').then(data => { if (Array.isArray(data)) setCommandes(data); });
      }, [partner]);

      const handleLogin = (p) => {
        setPartner(p);
        try { setAmenities(p.amenities ? JSON.parse(p.amenities) : null); } catch (e) { setAmenities(null); }
      };

      const refreshCommandes = () => {
        api.get('/commandes').then(data => { if (Array.isArray(data)) setCommandes(data); });
      };

      const handleCommander = async (notes) => {
        const items = Object.values(panier);
        if (items.length === 0 || submitting) return;
        setSubmitting(true);
        setLoading(true);
        try {
          const payload = {
            products: items.map(i => ({ ref: i.ref, quantite: i.quantite })),
            notes: notes || undefined,
          };
          let res;
          if (modifyingOrderId) {
            res = await api.patch(`/commande/${modifyingOrderId}`, payload);
          } else {
            res = await api.post('/commande', payload);
          }
          if (res.erreur) {
            showToast(res.erreur, "error");
          } else {
            setPanier({});
            localStorage.removeItem('tdm_panier');
            setPanierOpen(false);
            showToast(modifyingOrderId ? 'Commande modifi\u00e9e !' : 'Commande enregistr\u00e9e !', 'success');
            setModifyingOrderId(null);
            setModifyingNotes("");
            refreshCommandes();
            setVue('historique');
          }
        } catch (e) {
          showToast("Erreur lors de la commande", "error");
        }
        setLoading(false);
        setSubmitting(false);
      };

      const handleLogout = () => {
        sessionStorage.removeItem('partner_token');
        localStorage.removeItem('tdm_panier');
        setPartner(null);
        setCatalogue([]);
        setPanierRaw({});
        setCommandes([]);
      };

      const panierCount = Object.values(panier).reduce((s, i) => s + i.quantite, 0);

      if (!partner) return <LoginScreen onLogin={handleLogin} />;

      return (
        <div className="min-h-screen bg-white text-gray-900 relative">
          <div className="tache tache-1"></div>
          <div className="tache tache-2"></div>
          <Toast toast={toast} />

          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-200">
            <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2 sm:py-3 flex items-center justify-between">
              <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                <img src="/logo-tdm-anim.gif" alt="Terre de Mars" className="h-8 sm:h-10" />
                <span className="text-sm font-semibold text-gray-900 hidden sm:inline">{partner.nom}</span>
              </div>
              <div className="flex items-center gap-0.5 sm:gap-1">
                <button onClick={() => { setVue("catalogue"); setPanierOpen(false); setOrderSuccess(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "catalogue" && !panierOpen ? "bg-gold-50 text-gold-700 font-medium" : "text-gray-500 hover:text-gray-900"}`}>
                  Catalogue
                </button>
                <button onClick={() => { setVue("historique"); setPanierOpen(false); setOrderSuccess(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "historique" ? "bg-gold-50 text-gold-700 font-medium" : "text-gray-500 hover:text-gray-900"}`}>
                  Commandes
                </button>
                <button onClick={() => { setVue("profil"); setPanierOpen(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "profil" ? "bg-gold-50 text-gold-700 font-medium" : "text-gray-500 hover:text-gray-900"}`}>
                  <span className="hidden sm:inline">Mon compte</span><span className="sm:hidden">Compte</span>
                </button>
                <button onClick={() => { setPanierOpen(!panierOpen); setVue("catalogue"); }} className="relative px-2 sm:px-3 py-2 rounded-lg text-sm text-gray-500 hover:text-gray-900 transition-colors">
                  <span className="text-lg">&#128722;</span>
                  {panierCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-gold-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">{panierCount}</span>
                  )}
                </button>
                <button onClick={handleLogout} className="text-gray-400 hover:text-gray-600 text-sm sm:text-xs ml-1 sm:ml-2 p-1" title="D&eacute;connexion">
                  &#x2192;
                </button>
              </div>
            </div>
          </header>

          {/* Order success banner */}
          {orderSuccess && (
            <div className="bg-gold-50 border-b border-gold-200 animate-fade-in">
              <div className="max-w-6xl mx-auto px-4 py-4 text-center">
                <div className="text-gold-700 font-semibold mb-1">Commande enregistr&eacute;e !</div>
                <div className="text-sm text-gray-600">Nous vous recontactons sous 24h pour confirmer votre commande.</div>
              </div>
            </div>
          )}

          {/* Main content */}
          <main className={`max-w-6xl mx-auto px-4 py-6 relative z-10 ${panierCount > 0 && !panierOpen && vue === "catalogue" ? 'pb-24' : ''}`}>
            {panierOpen ? (
              <div className="max-w-lg mx-auto animate-fade-in">
                <h2 className="text-lg font-semibold text-gray-900 mb-4">Votre panier</h2>
                <PanierPanel panier={panier} setPanier={setPanier} onCommander={handleCommander} loading={submitting} partner={partner} modifyingOrderId={modifyingOrderId} initialNotes={modifyingNotes} />
              </div>
            ) : vue === "catalogue" ? (
              <div className="animate-fade-in">
                <DerniereCommandeSection commandes={commandes} catalogue={catalogue} setPanier={setPanier} setPanierOpen={setPanierOpen} showToast={showToast} />
                <AmenitiesSection amenities={amenities} catalogue={catalogue} panier={panier} setPanier={setPanier} />
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-semibold text-gray-900">Catalogue</h2>
                  <span className="text-xs text-gray-400">{catalogue.length} produit{catalogue.length > 1 ? 's' : ''}</span>
                </div>
                <CatalogueView catalogue={catalogue} panier={panier} setPanier={setPanier} />
              </div>
            ) : vue === "profil" ? (
              <ProfilView partner={partner} setPartner={setPartner} commandes={commandes} showToast={showToast} />
            ) : (
              <div className="max-w-2xl mx-auto animate-fade-in">
                <h2 className="text-lg font-semibold text-gray-900 mb-4">Historique des commandes</h2>
                <HistoriqueView commandes={commandes} onRefresh={refreshCommandes} catalogue={catalogue} setPanier={setPanier} setPanierOpen={setPanierOpen} setVue={setVue} setModifyingOrderId={setModifyingOrderId} setModifyingNotes={setModifyingNotes} showToast={showToast} partner={partner} />
              </div>
            )}
          </main>

          {/* Barre flottante total + franco */}
          {panierCount > 0 && !panierOpen && vue === "catalogue" && (() => {
            const items = Object.values(panier);
            const subtotalHT = items.reduce((s, i) => s + i.prix_remise * i.quantite, 0);
            const francoSeuil = partner.franco_seuil ?? 800;
            const exonere = partner.frais_exonere ?? 0;
            const francoAtteint = subtotalHT >= francoSeuil;
            const manque = Math.max(0, francoSeuil - subtotalHT);
            return (
              <div className="fixed bottom-0 left-0 right-0 z-20 bg-white/95 backdrop-blur border-t border-gray-200 shadow-lg safe-area-bottom">
                <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2 sm:py-3">
                  {!exonere && (
                    <div className="flex items-center gap-2 mb-1.5 sm:mb-2">
                      <div className="flex-1 bg-gray-200 rounded-full h-1.5 sm:h-2">
                        <div
                          className={`h-1.5 sm:h-2 rounded-full transition-all ${francoAtteint ? 'bg-gold-500' : 'bg-amber-500'}`}
                          style={{ width: `${Math.min(100, (subtotalHT / francoSeuil) * 100)}%` }}
                        />
                      </div>
                      <span className={`text-[10px] sm:text-[11px] font-medium shrink-0 ${francoAtteint ? 'text-gold-600' : 'text-amber-600'}`}>
                        {francoAtteint ? 'Franco' : `${manque.toFixed(0)} \u20ac restant`}
                      </span>
                    </div>
                  )}
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-gray-900 font-semibold text-sm">{subtotalHT.toFixed(2)} &euro; HT</span>
                      <span className="text-gray-400 text-[10px] sm:text-xs ml-1 sm:ml-2">{panierCount} art.</span>
                    </div>
                    <button
                      onClick={() => setPanierOpen(true)}
                      className="bg-gold-500 text-white px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold hover:bg-gold-600 transition-colors"
                    >
                      Voir le panier
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
