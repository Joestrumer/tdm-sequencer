    const App = () => {
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('tdm_dark_mode') === 'true');
      const toggleDarkMode = () => {
        setDarkMode(prev => {
          const next = !prev;
          if (next) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }
          localStorage.setItem('tdm_dark_mode', String(next));
          return next;
        });
      };
      const [partner, setPartner] = useState(null);
      const [vue, setVue] = useState("catalogue");
      const [catalogue, setCatalogue] = useState([]);
      const [promoActive, setPromoActive] = useState(false);
      const [promoTitle, setPromoTitle] = useState('');
      const [panier, setPanierRaw] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tdm_panier') || '{}'); } catch { return {}; }
      });
      const setPanier = (v) => setPanierRaw(prev => {
        const next = typeof v === 'function' ? v(prev) : v;
        localStorage.setItem('tdm_panier', JSON.stringify(next));
        return next;
      });
      const [commandes, setCommandes] = useState([]);
      const [panierOpen, setPanierOpen] = useState(false);
      const [modifyingOrderId, setModifyingOrderId] = useState(null);
      const [modifyingNotes, setModifyingNotes] = useState("");
      const [loading, setLoading] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(false);
      const [toast, setToast] = useState(null);
      const [amenities, setAmenities] = useState(null);
      const [isMaster, setIsMaster] = useState(() => sessionStorage.getItem('partner_is_master') === '1');
      const [etablissements, setEtablissements] = useState([]);
      const [selectedEtablissement, setSelectedEtablissement] = useState(null);

      const showToast = (message, type = "info") => {
        setToast({ message, type, visible: true });
        setTimeout(() => setToast(t => t ? { ...t, visible: false } : null), 4000);
      };

      useEffect(() => {
        const token = sessionStorage.getItem('partner_token');
        if (!token) return;

        const wasMaster = sessionStorage.getItem('partner_is_master') === '1';
        if (wasMaster) {
          // Restaurer session maître : charger les établissements
          api.get('/etablissements').then(res => {
            if (res.erreur) {
              sessionStorage.removeItem('partner_token');
              sessionStorage.removeItem('partner_is_master');
              sessionStorage.removeItem('partner_acting_as');
              return;
            }
            setIsMaster(true);
            setEtablissements(res);
            // Si un établissement était déjà sélectionné, restaurer
            const actingAs = sessionStorage.getItem('partner_acting_as');
            if (actingAs && res.some(e => String(e.id) === actingAs)) {
              const selected = res.find(e => String(e.id) === actingAs);
              setSelectedEtablissement(selected);
              api.get('/profil').then(profil => {
                if (!profil.erreur) {
                  setPartner(profil);
                  try { setAmenities(profil.amenities ? JSON.parse(profil.amenities) : null); } catch (e) { setAmenities(null); }
                }
              });
            }
          }).catch(() => {
            sessionStorage.removeItem('partner_token');
            sessionStorage.removeItem('partner_is_master');
            sessionStorage.removeItem('partner_acting_as');
          });
        } else {
          api.get('/profil').then(res => {
            if (res.erreur) {
              sessionStorage.removeItem('partner_token');
            } else {
              setPartner(res);
              try { setAmenities(res.amenities ? JSON.parse(res.amenities) : null); } catch (e) { setAmenities(null); }
            }
          }).catch(() => sessionStorage.removeItem('partner_token'));
        }
      }, []);

      const refreshCatalogue = useCallback(() => {
        api.get('/catalogue').then(data => {
          if (Array.isArray(data)) {
            setCatalogue(data);
          } else if (data && data.catalogue) {
            setCatalogue(data.catalogue);
            setPromoActive(!!data.promo_active);
            setPromoTitle(data.promo_title || '');
          }
        }).catch(() => {});
      }, []);

      useEffect(() => {
        if (!partner) return;
        refreshCatalogue();
        api.get('/commandes').then(data => { if (Array.isArray(data)) setCommandes(data); });
      }, [partner]);

      // Polling catalogue toutes les 60s pour refléter les changements promos
      useEffect(() => {
        if (!partner) return;
        const interval = setInterval(() => {
          if (!document.hidden) refreshCatalogue();
        }, 60000);
        return () => clearInterval(interval);
      }, [partner, refreshCatalogue]);

      const handleLogin = (res) => {
        if (res.isMaster) {
          sessionStorage.setItem('partner_is_master', '1');
          setIsMaster(true);
          setEtablissements(res.etablissements || []);
          // Ne pas encore charger le profil — attendre la sélection
        } else {
          const p = res.partenaire;
          setPartner(p);
          try { setAmenities(p.amenities ? JSON.parse(p.amenities) : null); } catch (e) { setAmenities(null); }
        }
      };

      const handleSelectEtablissement = async (etab) => {
        sessionStorage.setItem('partner_acting_as', String(etab.id));
        setSelectedEtablissement(etab);
        try {
          const profil = await api.get('/profil');
          if (!profil.erreur) {
            setPartner(profil);
            try { setAmenities(profil.amenities ? JSON.parse(profil.amenities) : null); } catch (e) { setAmenities(null); }
          }
        } catch (e) {
          showToast('Erreur chargement profil', 'error');
        }
      };

      const handleSwitchEtablissement = async (etabId) => {
        const etab = etablissements.find(e => String(e.id) === String(etabId));
        if (!etab) return;
        sessionStorage.setItem('partner_acting_as', String(etab.id));
        setSelectedEtablissement(etab);
        setPanier({});
        localStorage.removeItem('tdm_panier');
        setCatalogue([]);
        setVue('catalogue');
        setPanierOpen(false);
        try {
          const profil = await api.get('/profil');
          if (!profil.erreur) {
            setPartner(profil);
            try { setAmenities(profil.amenities ? JSON.parse(profil.amenities) : null); } catch (e) { setAmenities(null); }
          }
        } catch (e) {
          showToast('Erreur chargement profil', 'error');
        }
      };

      const refreshCommandes = () => {
        api.get('/commandes').then(data => { if (Array.isArray(data)) setCommandes(data); });
      };

      const handleCommander = async (notes) => {
        const items = Object.values(panier);
        if (items.length === 0 || submitting) return;
        setSubmitting(true);
        setLoading(true);
        try {
          const payload = {
            products: items.map(i => ({ ref: i.ref, quantite: i.quantite })),
            notes: notes || undefined,
          };
          let res;
          if (modifyingOrderId) {
            res = await api.patch(`/commande/${modifyingOrderId}`, payload);
          } else {
            res = await api.post('/commande', payload);
          }
          if (res.erreur) {
            showToast(res.erreur, "error");
          } else {
            setPanier({});
            localStorage.removeItem('tdm_panier');
            setPanierOpen(false);
            showToast(modifyingOrderId ? 'Commande modifi\u00e9e !' : 'Commande enregistr\u00e9e !', 'success');
            setModifyingOrderId(null);
            setModifyingNotes("");
            refreshCommandes();
            setVue('historique');
          }
        } catch (e) {
          showToast("Erreur lors de la commande", "error");
        }
        setLoading(false);
        setSubmitting(false);
      };

      const handleLogout = () => {
        sessionStorage.removeItem('partner_token');
        sessionStorage.removeItem('partner_is_master');
        sessionStorage.removeItem('partner_acting_as');
        localStorage.removeItem('tdm_panier');
        setPartner(null);
        setCatalogue([]);
        setPanierRaw({});
        setCommandes([]);
        setIsMaster(false);
        setEtablissements([]);
        setSelectedEtablissement(null);
      };

      const panierCount = Object.values(panier).reduce((s, i) => s + i.quantite, 0);

      if (!partner && !isMaster) return <LoginScreen onLogin={handleLogin} />;
      if (isMaster && !partner) return <EtablissementSelector etablissements={etablissements} onSelect={handleSelectEtablissement} />;

      return (
        <div className="min-h-screen bg-white dark:bg-slate-800 text-gray-900 dark:text-white relative">
          <div className="tache tache-1"></div>
          <div className="tache tache-2"></div>
          <Toast toast={toast} />

          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-gray-200 dark:border-slate-600">
            <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2 sm:py-3 flex items-center justify-between">
              <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                <img src="/logo-tdm-anim.gif" alt="Terre de Mars" className="h-8 sm:h-10" />
                {isMaster && selectedEtablissement ? (
                  <select
                    value={selectedEtablissement.id}
                    onChange={e => handleSwitchEtablissement(e.target.value)}
                    className="text-xs sm:text-sm font-semibold text-gray-900 dark:text-white bg-transparent border border-gray-200 dark:border-slate-600 rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-gold-500/50 hidden sm:block max-w-[200px] truncate"
                  >
                    {etablissements.map(e => (
                      <option key={e.id} value={e.id}>{e.nom}</option>
                    ))}
                  </select>
                ) : (
                  <span className="text-sm font-semibold text-gray-900 dark:text-white hidden sm:inline">{partner.nom}</span>
                )}
              </div>
              <div className="flex items-center gap-0.5 sm:gap-1">
                <button onClick={() => { setVue("catalogue"); setPanierOpen(false); setOrderSuccess(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "catalogue" && !panierOpen ? "bg-gold-50 dark:bg-gold-900/30 text-gold-700 dark:text-gold-400 font-medium" : "text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white"}`}>
                  Catalogue
                </button>
                {promoActive && catalogue.some(p => p.promo_pct > 0) && (
                  <button onClick={() => { setVue("bonsplans"); setPanierOpen(false); setOrderSuccess(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "bonsplans" ? "bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-400 font-medium" : "text-red-500 hover:text-red-700 dark:hover:text-red-400"}`}>
                    <span className="hidden sm:inline">Bons plans</span><span className="sm:hidden">Promos</span>
                  </button>
                )}
                <button onClick={() => { setVue("historique"); setPanierOpen(false); setOrderSuccess(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "historique" ? "bg-gold-50 dark:bg-gold-900/30 text-gold-700 dark:text-gold-400 font-medium" : "text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white"}`}>
                  Commandes
                </button>
                <button onClick={() => { setVue("documents"); setPanierOpen(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "documents" ? "bg-gold-50 dark:bg-gold-900/30 text-gold-700 dark:text-gold-400 font-medium" : "text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white"}`}>
                  <span className="hidden sm:inline">Documents</span><span className="sm:hidden">Docs</span>
                </button>
                <button onClick={() => { setVue("profil"); setPanierOpen(false); }} className={`px-2 sm:px-3 py-2 rounded-lg text-xs sm:text-sm transition-colors ${vue === "profil" ? "bg-gold-50 dark:bg-gold-900/30 text-gold-700 dark:text-gold-400 font-medium" : "text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white"}`}>
                  <span className="hidden sm:inline">Mon compte</span><span className="sm:hidden">Compte</span>
                </button>
                <button onClick={() => { setPanierOpen(!panierOpen); setVue("catalogue"); }} className="relative px-2 sm:px-3 py-2 rounded-lg text-sm text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white transition-colors">
                  <span className="text-lg">&#128722;</span>
                  {panierCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-gold-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">{panierCount}</span>
                  )}
                </button>
                <button onClick={toggleDarkMode} className="text-gray-400 dark:text-slate-400 hover:text-gray-600 dark:hover:text-slate-200 text-sm sm:text-base ml-1 p-1 transition-colors" title={darkMode ? 'Mode jour' : 'Mode nuit'}>
                  {darkMode ? '\u2600' : '\u263E'}
                </button>
                <button onClick={handleLogout} className="text-gray-400 dark:text-slate-400 hover:text-gray-600 dark:hover:text-slate-200 text-sm sm:text-xs ml-1 sm:ml-2 p-1" title="D&eacute;connexion">
                  &#x2192;
                </button>
              </div>
            </div>
          </header>

          {/* Order success banner */}
          {orderSuccess && (
            <div className="bg-gold-50 dark:bg-gold-900/30 border-b border-gold-200 dark:border-gold-800 animate-fade-in">
              <div className="max-w-6xl mx-auto px-4 py-4 text-center">
                <div className="text-gold-700 dark:text-gold-400 font-semibold mb-1">Commande enregistr&eacute;e !</div>
                <div className="text-sm text-gray-600 dark:text-slate-300">Nous vous recontactons sous 24h pour confirmer votre commande.</div>
              </div>
            </div>
          )}

          {/* Main content */}
          <main className={`max-w-6xl mx-auto px-4 py-6 relative z-10 ${panierCount > 0 && !panierOpen && (vue === "catalogue" || vue === "bonsplans") ? 'pb-24' : ''}`}>
            {panierOpen ? (
              <div className="max-w-lg mx-auto animate-fade-in">
                <h2 className="text-lg font-semibold text-gray-900 dark:text-white mb-4">Votre panier</h2>
                <PanierPanel panier={panier} setPanier={setPanier} onCommander={handleCommander} loading={submitting} partner={partner} modifyingOrderId={modifyingOrderId} initialNotes={modifyingNotes} />
              </div>
            ) : vue === "catalogue" ? (
              <div className="animate-fade-in">
                <DerniereCommandeSection commandes={commandes} catalogue={catalogue} setPanier={setPanier} setPanierOpen={setPanierOpen} showToast={showToast} />
                <AmenitiesSection amenities={amenities} catalogue={catalogue} panier={panier} setPanier={setPanier} />
                <PromotionsSection catalogue={catalogue} panier={panier} setPanier={setPanier} promoActive={promoActive} promoTitle={promoTitle} />
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-semibold text-gray-900 dark:text-white">Catalogue</h2>
                  <span className="text-xs text-gray-400 dark:text-slate-500">{catalogue.length} produit{catalogue.length > 1 ? 's' : ''}</span>
                </div>
                <CatalogueView catalogue={catalogue} panier={panier} setPanier={setPanier} />
              </div>
            ) : vue === "bonsplans" ? (
              <div className="animate-fade-in">
                <PromotionsSection catalogue={catalogue} panier={panier} setPanier={setPanier} promoActive={promoActive} promoTitle={promoTitle} />
              </div>
            ) : vue === "documents" ? (
              <div className="max-w-2xl mx-auto animate-fade-in">
                <h2 className="text-lg font-semibold text-gray-900 dark:text-white mb-4">Documents</h2>
                <DocumentsView />
              </div>
            ) : vue === "profil" ? (
              <ProfilView partner={partner} setPartner={setPartner} commandes={commandes} showToast={showToast} />
            ) : (
              <div className="max-w-2xl mx-auto animate-fade-in">
                <h2 className="text-lg font-semibold text-gray-900 dark:text-white mb-4">Historique des commandes</h2>
                <HistoriqueView commandes={commandes} onRefresh={refreshCommandes} catalogue={catalogue} setPanier={setPanier} setPanierOpen={setPanierOpen} setVue={setVue} setModifyingOrderId={setModifyingOrderId} setModifyingNotes={setModifyingNotes} showToast={showToast} partner={partner} isMaster={isMaster} />
              </div>
            )}
          </main>

          {/* Barre flottante total + franco */}
          {panierCount > 0 && !panierOpen && (vue === "catalogue" || vue === "bonsplans") && (() => {
            const items = Object.values(panier);
            const subtotalHT = items.reduce((s, i) => s + (i.prix_promo ?? i.prix_remise) * i.quantite, 0);
            const francoSeuil = partner.franco_seuil ?? 800;
            const exonere = partner.frais_exonere ?? 0;
            const francoAtteint = subtotalHT >= francoSeuil;
            const manque = Math.max(0, francoSeuil - subtotalHT);
            return (
              <div className="fixed bottom-0 left-0 right-0 z-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-gray-200 dark:border-slate-600 shadow-lg dark:shadow-none safe-area-bottom">
                <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2 sm:py-3">
                  {!exonere && (
                    <div className="flex items-center gap-2 mb-1.5 sm:mb-2">
                      <div className="flex-1 bg-gray-200 dark:bg-slate-600 rounded-full h-1.5 sm:h-2">
                        <div
                          className={`h-1.5 sm:h-2 rounded-full transition-all ${francoAtteint ? 'bg-gold-500' : 'bg-amber-500'}`}
                          style={{ width: `${Math.min(100, (subtotalHT / francoSeuil) * 100)}%` }}
                        />
                      </div>
                      <span className={`text-[10px] sm:text-[11px] font-medium shrink-0 ${francoAtteint ? 'text-gold-600' : 'text-amber-600'}`}>
                        {francoAtteint ? `Franco \u2014 ${(partner.fp_prix ?? 0).toFixed(0)} \u20ac FP` : `${manque.toFixed(0)} \u20ac restant`}
                      </span>
                    </div>
                  )}
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-gray-900 dark:text-white font-semibold text-sm">{subtotalHT.toFixed(2)} &euro; HT</span>
                      <span className="text-gray-400 dark:text-slate-500 text-[10px] sm:text-xs ml-1 sm:ml-2">{panierCount} art.</span>
                    </div>
                    <button
                      onClick={() => setPanierOpen(true)}
                      className="bg-gold-500 text-white px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold hover:bg-gold-600 transition-colors"
                    >
                      Voir le panier
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
